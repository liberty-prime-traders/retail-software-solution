spring:
  config:
    import: optional:file:docker/dev.env[.properties]
  application:
    name: retail-software-solution

  datasource:
    location:
      jdbc-url: jdbc:postgresql://${DB_DOMAIN}:${DB_PORT}/${DB_NAME}?sslmode=prefer
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      changelog: db/changelog/locations/db-changelog-master.yml
      hikari:
        auto-commit: false
        idle-timeout: 300000  # 5 minutes
        max-lifetime: 600000

    platform: # Datasource for metadata
      jdbc-url: jdbc:postgresql://${DB_DOMAIN}:${DB_PORT}/${DB_NAME}?sslmode=prefer&currentSchema=platform
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      hikari:
        auto-commit: false
        idle-timeout: 300000  # 5 minutes
        max-lifetime: 600000

    organization:
      jdbc-url: jdbc:postgresql://${DB_DOMAIN}:${DB_PORT}/${DB_NAME}?sslmode=prefer
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      changelog: db/changelog/organizations/db-changelog-master.yml
      hikari:
        auto-commit: false
        idle-timeout: 300000  # 5 minutes
        max-lifetime: 600000

  cache:
    caffeine:
      spec: maximumSize=100
    type: caffeine

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  jpa:
    show-sql: ${SHOW_SQL:false}
    open-in-view: false
    hibernate:
      ddl-auto: validate

  task:
    scheduling:
      pool:
        size: 5

  kafka:
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: me.ezra_home.retail_software_solution.messaging.kafka.*

rts:
  jwt:
    secret: ${RTS_JWT_SECRET}
    expiration-minutes: ${RTS_JWT_EXPIRATION_MINUTES:60}
  pending-identity-link:
    expiration-minutes: ${RTS_PENDING_IDENTITY_LINK_EXPIRATION_MINUTES:20}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID}

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    org.hibernate:
      SQL: ${HIBERNATE_SQL_LOGGING:DEBUG}
      envers: ${HIBERNATE_ENVERS_LOGGING:DEBUG}
      type: ${HIBERNATE_TYPE_LOGGING:TRACE}
