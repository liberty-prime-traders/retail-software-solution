databaseChangeLog:
  - changeSet:
      id: create-location-product-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: location_product_aud
      changes:
        - createTable:
            tableName: location_product_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: uuid
              - column:
                  name: name
                  type: varchar(100)
              - column:
                  name: product_group_name
                  type: varchar(100)
              - column:
                  name: category_id
                  type: uuid
              - column:
                  name: base_unit_id
                  type: uuid
              - column:
                  name: default_sale_price
                  type: decimal(15,2)
              - column:
                  name: min_stock_level
                  type: integer
              - column:
                  name: status
                  type: varchar(5)
              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: location_product_aud
            columnNames: id, rev
            constraintName: pk_location_product_aud
      rollback:
        - dropTable:
            tableName: location_product_aud
