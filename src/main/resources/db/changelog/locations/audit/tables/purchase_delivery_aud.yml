databaseChangeLog:
  - changeSet:
      id: create-purchase-delivery-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: purchase_delivery_aud
      changes:
        - createTable:
            tableName: purchase_delivery_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: purchase_id
                  type: uuid

              - column:
                  name: status
                  type: varchar(5)

              - column:
                  name: delivered_at
                  type: timestamptz

              - column:
                  name: notes
                  type: text

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: purchase_delivery_aud
            columnNames: id, rev
            constraintName: pk_purchase_delivery_aud

      rollback:
        - dropTable:
            tableName: purchase_delivery_aud
