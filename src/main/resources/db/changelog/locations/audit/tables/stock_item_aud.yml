databaseChangeLog:
  - changeSet:
      id: create-stock-item-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_item_aud
      changes:
        - createTable:
            tableName: stock_item_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: purchase_delivery_line_id
                  type: uuid

              - column:
                  name: location_product_id
                  type: uuid

              - column:
                  name: quantity_received
                  type: decimal(15,3)

              - column:
                  name: quantity_remaining
                  type: decimal(15,3)

              - column:
                  name: unit_cost
                  type: decimal(15,2)

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: stock_item_aud
            columnNames: id, rev
            constraintName: pk_stock_item_aud

      rollback:
        - dropTable:
            tableName: stock_item_aud
