databaseChangeLog:
  - changeSet:
      id: create-stock-movement-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_movement_aud
      changes:
        - createTable:
            tableName: stock_movement_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: stock_entry_id
                  type: uuid

              - column:
                  name: movement_type
                  type: varchar(5)

              - column:
                  name: reason_id
                  type: uuid

              - column:
                  name: category
                  type: varchar(5)

              - column:
                  name: note
                  type: varchar(500)

              - column:
                  name: storage_moved_quantity
                  type: numeric(28,4)

              - column:
                  name: user_provided_moved_quantity
                  type: numeric(19,4)

              - column:
                  name: storage_remaining_quantity
                  type: numeric(28,4)

              - column:
                  name: moved_cost
                  type: numeric(28,4)

              - column:
                  name: storage_moved_breakdown_text
                  type: varchar(200)

              - column:
                  name: storage_remaining_breakdown_text
                  type: varchar(200)

              - column:
                  name: document_reference
                  type: varchar(30)

              - column:
                  name: detail_reference
                  type: varchar(30)

              - column:
                  name: unit_id
                  type: uuid

              - column:
                  name: storage_units_per_unit
                  type: bigint

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: stock_movement_aud
            columnNames: id, rev
            constraintName: pk_stock_movement_aud

      rollback:
        - dropTable:
            tableName: stock_movement_aud
