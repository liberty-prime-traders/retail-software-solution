databaseChangeLog:
  - changeSet:
      id: create-sale-line-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_line_aud
      changes:
        - createTable:
            tableName: sale_line_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: sale_id
                  type: uuid

              - column:
                  name: location_product_id
                  type: uuid

              - column:
                  name: quantity
                  type: numeric(19, 4)

              - column:
                  name: unit_id
                  type: uuid

              - column:
                  name: unit_price
                  type: numeric(19, 4)

              - column:
                  name: conversion_factor
                  type: decimal(19,10)

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: sale_line_aud
            columnNames: id, rev
            constraintName: pk_sale_line_aud

      rollback:
        - dropTable:
            tableName: sale_line_aud
