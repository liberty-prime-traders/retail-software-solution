databaseChangeLog:
  - changeSet:
      id: create-sale-line-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_line_aud
      changes:
        - createTable:
            tableName: sale_line_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: sale_id
                  type: uuid

              - column:
                  name: location_product_id
                  type: uuid

              - column:
                  name: user_provided_quantity
                  type: numeric(19, 4)

              - column:
                  name: unit_id
                  type: uuid

              - column:
                  name: line_total
                  type: numeric(19, 4)

              - column:
                  name: default_sale_price
                  type: numeric(28, 10)

              - column:
                  name: storage_units_per_user_provided_unit
                  type: bigint

              - column:
                  name: cogs_total
                  type: numeric(19, 4)

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: sale_line_aud
            columnNames: id, rev
            constraintName: pk_sale_line_aud

      rollback:
        - dropTable:
            tableName: sale_line_aud
