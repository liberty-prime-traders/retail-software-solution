databaseChangeLog:
  - changeSet:
      id: create-sale-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_aud
      changes:
        - createTable:
            tableName: sale_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: contact_id
                  type: uuid

              - column:
                  name: sold_by
                  type: uuid

              - column:
                  name: date_sold
                  type: timestamptz

              - column:
                  name: notes
                  type: text

              - column:
                  name: status
                  type: varchar(5)

              - column:
                  name: payment_status
                  type: varchar(5)

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: sale_aud
            columnNames: id, rev
            constraintName: pk_sale_aud

      rollback:
        - dropTable:
            tableName: sale_aud
