databaseChangeLog:
  - changeSet:
      id: create-stock-transfer-dispatch-line-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_transfer_dispatch_line_aud
      changes:
        - createTable:
            tableName: stock_transfer_dispatch_line_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: stock_transfer_dispatch_id
                  type: uuid

              - column:
                  name: product_id
                  type: uuid

              - column:
                  name: location_product_id
                  type: uuid

              - column:
                  name: quantity_dispatched
                  type: numeric(15,4)

              - column:
                  name: unit_id
                  type: uuid

              - column:
                  name: unit_cost
                  type: numeric(19,4)

              - column:
                  name: conversion_numerator
                  type: bigint
              - column:
                  name: conversion_denominator
                  type: bigint

              - column:
                  name: base_unit_id
                  type: uuid

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: stock_transfer_dispatch_line_aud
            columnNames: id, rev
            constraintName: pk_stock_transfer_dispatch_line_aud

      rollback:
        - dropTable:
            tableName: stock_transfer_dispatch_line_aud
