databaseChangeLog:
  - changeSet:
      id: create-index-tax-entry-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_tax_entry_aud_rev
      changes:
        - createIndex:
            indexName: idx_tax_entry_aud_rev
            tableName: tax_entry_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_tax_entry_aud_rev
            tableName: tax_entry_aud

  - changeSet:
      id: create-index-tax-entry-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_tax_entry_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_tax_entry_aud_id_rev_partial ON tax_entry_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_tax_entry_aud_id_rev_partial
