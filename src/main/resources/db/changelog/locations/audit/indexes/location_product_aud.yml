databaseChangeLog:
  - changeSet:
      id: create-index-location-product-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_location_product_aud_rev
      changes:
        - createIndex:
            indexName: idx_location_product_aud_rev
            tableName: location_product_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_location_product_aud_rev
            tableName: location_product_aud

  - changeSet:
      id: create-index-location-product-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_location_product_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_location_product_aud_id_rev_partial ON location_product_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_location_product_aud_id_rev_partial
