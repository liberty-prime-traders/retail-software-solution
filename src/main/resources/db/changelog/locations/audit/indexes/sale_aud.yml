databaseChangeLog:
  - changeSet:
      id: create-index-sale-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_sale_aud_rev
      changes:
        - createIndex:
            indexName: idx_sale_aud_rev
            tableName: sale_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_sale_aud_rev
            tableName: sale_aud

  - changeSet:
      id: create-index-sale-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_sale_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_sale_aud_id_rev_partial ON sale_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_sale_aud_id_rev_partial
