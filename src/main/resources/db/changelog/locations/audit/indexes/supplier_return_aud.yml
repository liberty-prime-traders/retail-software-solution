databaseChangeLog:
  - changeSet:
      id: create-index-supplier-return-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_supplier_return_aud_rev
      changes:
        - createIndex:
            indexName: idx_supplier_return_aud_rev
            tableName: supplier_return_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_supplier_return_aud_rev
            tableName: supplier_return_aud

  - changeSet:
      id: create-index-supplier-return-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_supplier_return_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_supplier_return_aud_id_rev_partial ON supplier_return_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_supplier_return_aud_id_rev_partial
