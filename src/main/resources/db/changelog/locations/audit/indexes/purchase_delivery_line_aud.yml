databaseChangeLog:
  - changeSet:
      id: create-index-purchase-delivery-line-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_purchase_delivery_line_aud_rev
      changes:
        - createIndex:
            indexName: idx_purchase_delivery_line_aud_rev
            tableName: purchase_delivery_line_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_purchase_delivery_line_aud_rev
            tableName: purchase_delivery_line_aud

  - changeSet:
      id: create-index-purchase-delivery-line-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_purchase_delivery_line_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_purchase_delivery_line_aud_id_rev_partial ON purchase_delivery_line_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_purchase_delivery_line_aud_id_rev_partial
