databaseChangeLog:
  - changeSet:
      id: add-foreign-key-sale-line-aud-revinfo
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_sale_line_aud_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: sale_line_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_sale_line_aud_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sale_line_aud
            constraintName: fk_sale_line_aud_revinfo

  - changeSet:
      id: add-foreign-key-sale-line-aud-revend-revinfo
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_sale_line_aud_revend_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: sale_line_aud
            baseColumnNames: revend
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_sale_line_aud_revend_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sale_line_aud
            constraintName: fk_sale_line_aud_revend_revinfo
