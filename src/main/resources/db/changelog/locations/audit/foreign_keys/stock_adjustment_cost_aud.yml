databaseChangeLog:
  - changeSet:
      id: add-foreign-key-stock-adjustment-cost-aud-revinfo
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_stock_adjustment_cost_aud_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: stock_adjustment_cost_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_stock_adjustment_cost_aud_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stock_adjustment_cost_aud
            constraintName: fk_stock_adjustment_cost_aud_revinfo

  - changeSet:
      id: add-foreign-key-stock-adjustment-cost-aud-revend-revinfo
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_stock_adjustment_cost_aud_revend_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: stock_adjustment_cost_aud
            baseColumnNames: revend
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_stock_adjustment_cost_aud_revend_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stock_adjustment_cost_aud
            constraintName: fk_stock_adjustment_cost_aud_revend_revinfo
