                indexName: idx_supplier_return_purchase_id
      changes:
        - createIndex:
            indexName: idx_supplier_return_purchase_id
            tableName: supplier_return
            columns:
              - column:
                  name: purchase_id
      rollback:
        - dropIndex:
            indexName: idx_supplier_return_purchase_id
            tableName: supplier_return

  - changeSet:
      id: create-index-supplier-return-purchase-delivery-id
      author: ezra
