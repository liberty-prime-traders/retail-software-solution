databaseChangeLog:
  - changeSet:
      id: create-index-supplier-return-supplier-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_supplier_return_supplier_id
      changes:
        - createIndex:
            indexName: idx_supplier_return_supplier_id
            tableName: supplier_return
            columns:
              - column:
                  name: supplier_id
      rollback:
        - dropIndex:
            indexName: idx_supplier_return_supplier_id
            tableName: supplier_return

  - changeSet:
      id: create-index-supplier-return-purchase-id
      author: ezra
