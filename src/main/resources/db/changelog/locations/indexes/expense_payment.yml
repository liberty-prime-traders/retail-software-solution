databaseChangeLog:
  - changeSet:
      id: create-index-expense-payment-expense-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_expense_payment_expense_id
      changes:
        - createIndex:
            indexName: idx_expense_payment_expense_id
            tableName: expense_payment
            columns:
              - column:
                  name: expense_id
      rollback:
        - dropIndex:
            indexName: idx_expense_payment_expense_id
            tableName: expense_payment
