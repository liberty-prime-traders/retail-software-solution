databaseChangeLog:
  - changeSet:
      id: create-index-purchase-delivery-purchase-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_purchase_delivery_purchase_id
      changes:
        - createIndex:
            indexName: idx_purchase_delivery_purchase_id
            tableName: purchase_delivery
            columns:
              - column:
                  name: purchase_id
      rollback:
        - dropIndex:
            indexName: idx_purchase_delivery_purchase_id
            tableName: purchase_delivery

  - changeSet:
      id: create-index-purchase-delivery-status-delivered-at
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_purchase_delivery_status_delivered_at
      changes:
        - createIndex:
            indexName: idx_purchase_delivery_status_delivered_at
            tableName: purchase_delivery
            columns:
              - column:
                  name: status
              - column:
                  name: delivered_at
      rollback:
        - dropIndex:
            indexName: idx_purchase_delivery_status_delivered_at
            tableName: purchase_delivery
