databaseChangeLog:
  - changeSet:
      id: create-index-supplier-payment-purchase-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_supplier_payment_purchase_id
      changes:
        - createIndex:
            indexName: idx_supplier_payment_purchase_id
            tableName: supplier_payment
            columns:
              - column:
                  name: purchase_id
      rollback:
        - dropIndex:
            indexName: idx_supplier_payment_purchase_id
            tableName: supplier_payment

  - changeSet:
      id: create-index-supplier-payment-delivery-id
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_supplier_payment_delivery_id
      changes:
        - createIndex:
            indexName: idx_supplier_payment_delivery_id
            tableName: supplier_payment
            columns:
              - column:
                  name: delivery_id
      rollback:
        - dropIndex:
            indexName: idx_supplier_payment_delivery_id
            tableName: supplier_payment

  - changeSet:
      id: create-index-supplier-payment-created-on-id
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_supplier_payment_created_on_id
      changes:
        - createIndex:
            indexName: idx_supplier_payment_created_on_id
            tableName: supplier_payment
            columns:
              - column:
                  name: created_on
                  descending: true
              - column:
                  name: id
                  descending: true
      rollback:
        - dropIndex:
            indexName: idx_supplier_payment_created_on_id
            tableName: supplier_payment

  - changeSet:
      id: create-index-supplier-payment-payment-date
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_supplier_payment_payment_date
      changes:
        - createIndex:
            indexName: idx_supplier_payment_payment_date
            tableName: supplier_payment
            columns:
              - column:
                  name: payment_date
      rollback:
        - dropIndex:
            indexName: idx_supplier_payment_payment_date
            tableName: supplier_payment
