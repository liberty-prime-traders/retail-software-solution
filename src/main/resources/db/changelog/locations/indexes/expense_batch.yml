databaseChangeLog:
  - changeSet:
      id: add-unique-constraint-expense-batch-source-type-source-reference
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                tableName: expense_batch
                indexName: uq_expense_batch_source_type_source_reference
      changes:
        - sql:
            sql: CREATE UNIQUE INDEX uq_expense_batch_source_type_source_reference ON expense_batch (source_type, source_reference) WHERE source_reference IS NOT NULL;
      rollback:
        - dropIndex:
            tableName: expense_batch
            indexName: uq_expense_batch_source_type_source_reference
