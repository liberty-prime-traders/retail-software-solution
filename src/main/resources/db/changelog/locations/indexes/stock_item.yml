databaseChangeLog:
  - changeSet:
      id: create-index-stock-item-purchase-delivery-line-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_item_purchase_delivery_line_id
      changes:
        - createIndex:
            indexName: idx_stock_item_purchase_delivery_line_id
            tableName: stock_item
            columns:
              - column:
                  name: purchase_delivery_line_id
      rollback:
        - dropIndex:
            indexName: idx_stock_item_purchase_delivery_line_id
            tableName: stock_item

  - changeSet:
      id: create-index-stock-item-location-product-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_item_location_product_id
      changes:
        - createIndex:
            indexName: idx_stock_item_location_product_id
            tableName: stock_item
            columns:
              - column:
                  name: location_product_id
      rollback:
        - dropIndex:
            indexName: idx_stock_item_location_product_id
            tableName: stock_item
