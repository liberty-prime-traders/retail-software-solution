databaseChangeLog:
  - changeSet:
      id: create-index-sale-line-stock-reservation-sale-id
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_slsr_sale_id
      changes:
        - createIndex:
            indexName: idx_slsr_sale_id
            tableName: sale_line_stock_reservation
            columns:
              - column:
                  name: sale_id
      rollback:
