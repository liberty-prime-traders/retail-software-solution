databaseChangeLog:
  - changeSet:
      id: create-index-sale-line-sale-id
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_sale_line_sale_id
      changes:
        - createIndex:
            indexName: idx_sale_line_sale_id
            tableName: sale_line
            columns:
              - column:
                  name: sale_id
      rollback:
        - dropIndex:
            indexName: idx_sale_line_sale_id
            tableName: sale_line
