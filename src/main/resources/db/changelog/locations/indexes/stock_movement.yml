databaseChangeLog:
  - changeSet:
      id: create-index-stock-movement-stock-item-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_stock_entry_id
      changes:
        - createIndex:
            indexName: idx_stock_movement_stock_entry_id
            tableName: stock_movement
            columns:
              - column:
                  name: stock_entry_id
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_stock_entry_id
            tableName: stock_movement

  - changeSet:
      id: create-index-stock-movement-document-reference
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_document_reference
      changes:
        - createIndex:
            indexName: idx_stock_movement_document_reference
            tableName: stock_movement
            columns:
              - column:
                  name: document_reference
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_document_reference
            tableName: stock_movement

  - changeSet:
      id: create-idx-stock-movement-location-product-id-created-on
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_location_product_id_created_on
      changes:
        - createIndex:
            indexName: idx_stock_movement_location_product_id_created_on
            tableName: stock_movement
            columns:
              - column:
                  name: location_product_id

              - column:
                  name: created_on
                  descending: true
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_location_product_id_created_on
            tableName: stock_movement

  - changeSet:
      id: add-unique-index-stock-movement-doc-detail-type-product-entry-reason
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: uq_stock_movement_doc_detail_type_product_entry_reason
      changes:
        - sql:
            sql: >-
              CREATE UNIQUE INDEX uq_stock_movement_doc_detail_type_product_entry_reason ON stock_movement
              (document_reference, COALESCE(detail_reference, ''), movement_type, location_product_id, stock_entry_id,
              COALESCE(reason_id, '00000000-0000-0000-0000-000000000000'::uuid))
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS uq_stock_movement_doc_detail_type_product_entry_reason
