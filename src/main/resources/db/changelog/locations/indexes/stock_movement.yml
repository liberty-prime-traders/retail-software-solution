databaseChangeLog:
  - changeSet:
      id: create-index-stock-movement-stock-item-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_stock_entry_id
      changes:
        - createIndex:
            indexName: idx_stock_movement_stock_entry_id
            tableName: stock_movement
            columns:
              - column:
                  name: stock_entry_id
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_stock_entry_id
            tableName: stock_movement

  - changeSet:
      id: create-index-stock-movement-external_reference_number
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_external_reference_number
      changes:
        - createIndex:
            indexName: idx_stock_movement_external_reference_number
            tableName: stock_movement
            columns:
              - column:
                  name: external_reference_number
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_external_reference_number
            tableName: stock_movement

  - changeSet:
      id: create-idx-stock-movement-location-product-id-created-on
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_movement_location_product_id_created_on
      changes:
        - createIndex:
            indexName: idx_stock_movement_location_product_id_created_on
            tableName: stock_movement
            columns:
              - column:
                  name: location_product_id
              - column:
                  name: created_on
                  descending: true
      rollback:
        - dropIndex:
            indexName: idx_stock_movement_location_product_id_created_on
            tableName: stock_movement
