databaseChangeLog:
  - changeSet:
      id: create-index-expense-payment-state-payment-status
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_expense_payment_state_payment_status
      changes:
        - createIndex:
            indexName: idx_expense_payment_state_payment_status
            tableName: expense_payment_state
            columns:
              - column:
                  name: payment_status
      rollback:
        - dropIndex:
            indexName: idx_expense_payment_state_payment_status
            tableName: expense_payment_state
