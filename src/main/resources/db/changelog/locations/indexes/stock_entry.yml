databaseChangeLog:
  - changeSet:
      id: create-index-stock-entry-location-product-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - indexExists:
            indexName: idx_stock_entry_location_product_id
      changes:
        - dropIndex:
            indexName: idx_stock_entry_location_product_id
            tableName: stock_entry
      rollback:
        - createIndex:
            indexName: idx_stock_entry_location_product_id
            tableName: stock_entry
            columns:
              - column:
                  name: location_product_id

  - changeSet:
      id: create-index-stock-entry-location-product-id-available
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_stock_entry_location_product_id_available
      changes:
        - sql:
            sql: CREATE INDEX idx_stock_entry_location_product_id_available ON stock_entry (location_product_id, priority, created_on) WHERE quantity_remaining > 0
      rollback:
        - dropIndex:
            indexName: idx_stock_entry_location_product_id_available
            tableName: stock_entry

  - changeSet:
      id: add-unique-constraint-stock-entry-ext-ref-type-product
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - uniqueConstraintExists:
                tableName: stock_entry
                constraintName: uq_stock_entry_ext_ref_type_product
      changes:
        - addUniqueConstraint:
            tableName: stock_entry
            constraintName: uq_stock_entry_ext_ref_type_product
            columnNames: external_reference_number, source_type, location_product_id
      rollback:
        - dropUniqueConstraint:
            tableName: stock_entry
            constraintName: uq_stock_entry_ext_ref_type_product
