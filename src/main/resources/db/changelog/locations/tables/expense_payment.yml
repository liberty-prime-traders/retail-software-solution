databaseChangeLog:
  - changeSet:
      id: create-expense-payment-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: expense_payment
      changes:
        - createTable:
            tableName: expense_payment
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_expense_payment_reference_number

              - column:
                  name: expense_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_expense_id_notnull

              - column:
                  name: payment_method_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_payment_method_id_notnull

              - column:
                  name: payment_method_account_code
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_payment_method_account_code_notnull

              - column:
                  name: amount
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_amount_notnull

              - column:
                  name: provider_reference
                  type: varchar(100)

              - column:
                  name: payment_date
                  type: timestamptz
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_payment_date_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_payment_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: expense_payment
