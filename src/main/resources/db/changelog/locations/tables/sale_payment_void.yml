databaseChangeLog:
  - changeSet:
      id: create-sale-payment-void-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_payment_void
      changes:
        - createTable:
            tableName: sale_payment_void
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_payment_void_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_sale_payment_void_reference_number

              - column:
                  name: sale_payment_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_payment_void_sale_payment_id_notnull
                    unique: true
                    uniqueConstraintName: uq_sale_payment_void_sale_payment_id

              - column:
                  name: reason
                  type: text
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_payment_void_reason_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_payment_void_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: sale_payment_void
