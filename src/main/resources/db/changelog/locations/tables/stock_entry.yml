databaseChangeLog:
  - changeSet:
      id: create-stock-entry-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_entry
      changes:
        - createTable:
            tableName: stock_entry
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_stock_entry_reference_number

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_location_product_id_notnull

              - column:
                  name: source_type
                  type: varchar(5)

              - column:
                  name: document_reference
                  type: varchar(30)

              - column:
                  name: detail_reference
                  type: varchar(30)

              - column:
                  name: storage_batch_size
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_storage_batch_size_notnull

              - column:
                  name: storage_quantity_remaining
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_storage_quantity_remaining_notnull

              - column:
                  name: priority
                  type: integer
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_priority_notnull

              - column:
                  name: unit_cost
                  type: decimal(28,10)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_unit_cost_notnull

              - column:
                  name: batch_cost
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_batch_cost_notnull

              - column:
                  name: cost_remaining
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_cost_remaining_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_entry_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
