databaseChangeLog:
  - changeSet:
      id: create-sale-discount-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_discount
      changes:
        - createTable:
            tableName: sale_discount
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_reference_number_notnull
                    unique: true
                    uniqueConstraintName: sale_discount_reference_number_unique

              - column:
                  name: sale_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_sale_id_notnull

              - column:
                  name: sale_line_id
                  type: uuid

              - column:
                  name: discount_type
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_discount_type_notnull

              - column:
                  name: value
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_value_notnull

              - column:
                  name: calculated_amount
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_calculated_amount_notnull

              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_description_notnull

              - column:
                  name: approved_by_id
                  type: uuid

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_discount_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: sale_discount
