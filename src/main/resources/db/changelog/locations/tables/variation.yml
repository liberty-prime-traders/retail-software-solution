databaseChangeLog:
  - changeSet:
      id: 'create_variation_table'
      author: ezra
      labels: 1.0.0
      preConditions:
        - not:
            - tableExists:
                tableName: variation
      changes:
        - createTable:
            tableName: variation
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: nvarchar2

              - column:
                  name: description
                  type: nvarchar2

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: variation_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: '0'

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: variation_reference_number_unique
                    nullable: false
                    notNullConstraintName: variation_reference_number_not_null
