databaseChangeLog:
  - changeSet:
      id: create-supplier-payment-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: supplier_payment
      changes:
        - createTable:
            tableName: supplier_payment
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_supplier_payment_reference_number

              - column:
                  name: purchase_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_purchase_id_notnull

              - column:
                  name: delivery_id
                  type: uuid

              - column:
                  name: payment_method_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_payment_method_id_notnull

              - column:
                  name: amount
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_amount_notnull

              - column:
                  name: payment_date
                  type: timestamptz
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_payment_date_notnull

              - column:
                  name: notes
                  type: text

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: supplier_payment_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: supplier_payment
