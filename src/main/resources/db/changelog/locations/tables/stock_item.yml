databaseChangeLog:
  - changeSet:
      id: create-stock-item-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_item
      changes:
        - createTable:
            tableName: stock_item
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_reference_number_notnull
                    unique: true
                    uniqueConstraintName: stock_item_reference_number_unique

              - column:
                  name: purchase_delivery_line_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_purchase_delivery_line_id_notnull

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_location_product_id_notnull

              - column:
                  name: quantity_received
                  type: decimal(15,3)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_quantity_received_notnull

              - column:
                  name: quantity_remaining
                  type: decimal(15,3)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_quantity_remaining_notnull

              - column:
                  name: unit_cost
                  type: decimal(15,2)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_unit_cost_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_item_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
