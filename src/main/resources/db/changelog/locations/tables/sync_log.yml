databaseChangeLog:
  - changeSet:
      id: create-sync-log-table
      author: ezra
      changes:
        - createTable:
            tableName: sync_log
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: sync_log_reference_number_unique
                    nullable: false
                    notNullConstraintName: sync_log_reference_number_not_null

              - column:
                  name: table_name
                  type: varchar(50)
                  constraints:
                    nullable: false
                    notNullConstraintName: sync_log_table_name_notnull

              - column:
                  name: sync_mode
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: sync_log_sync_mode_notnull

              - column:
                  name: total_records
                  type: integer
                  constraints:
                    nullable: true

              - column:
                  name: processed_records
                  type: integer
                  defaultValueNumeric: "0"

              - column:
                  name: skipped_records
                  type: integer
                  defaultValueNumeric: "0"

              - column:
                  name: failed_records
                  type: integer
                  defaultValueNumeric: "0"

              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
                    notNullConstraintName: sync_log_status_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: completed_at
                  type: timestamptz

              - column:
                  name: canceled_at
                  type: timestamptz

              - column:
                  name: last_processed_revision
                  type: bigint

              - column:
                  name: started_at
                  type: timestamptz

              - column:
                  name: error_message
                  type: text

              - column:
                  name: initiate_type
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: sync_log_initiate_type_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sync_log_created_by_id_notnull
