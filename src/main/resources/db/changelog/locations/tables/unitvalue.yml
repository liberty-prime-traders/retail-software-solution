databaseChangeLog:
  - changeSet:
      id: 'create-unit-value-table'
      author: kenneth
      preConditions:
        - not:
            - tableExists:
                tableName: unit_value
      changes:
        - createTable:
            tableName: unit_value
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: global_id
                  type: uuid
                  defaultValueComputed: ${uuid_function}

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_name_notnull

              - column:
                  name: code
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_code_notnull

              - column:
                  name: description
                  type: varchar

              - column:
                  name: unit_group_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_unit_group_id_notnull

              - column:
                  name: base_unit
                  type: uuid

              - column:
                  name: conversion_factor
                  type: decimal

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: '0'
