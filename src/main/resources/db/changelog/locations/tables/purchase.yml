databaseChangeLog:
  - changeSet:
      id: create-purchase-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: purchase
      changes:
        - createTable:
            tableName: purchase
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_purchase_reference_number

              - column:
                  name: supplier_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_supplier_id_notnull

              - column:
                  name: purchase_status
                  type: varchar(5)
                  defaultValue: DFT
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_purchase_status_notnull

              - column:
                  name: payment_status
                  type: varchar(5)
                  defaultValue: UNP
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_payment_status_notnull

              - column:
                  name: notes
                  type: text

              - column:
                  name: date_ordered
                  type: timestamptz

              - column:
                  name: ordered_by
                  type: uuid

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
