databaseChangeLog:
  - changeSet:
      id: create-expense-batch-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: expense_batch
      changes:
        - createTable:
            tableName: expense_batch
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_batch_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_expense_batch_reference_number

              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_batch_description_notnull

              - column:
                  name: source_type
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_batch_source_type_notnull

              - column:
                  name: source_reference
                  type: varchar(30)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: expense_batch_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: expense_batch
