databaseChangeLog:
  - changeSet:
      id: create-stock-movement-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: stock_movement
      changes:
        - createTable:
            tableName: stock_movement
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_stock_movement_reference_number

              - column:
                  name: stock_entry_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_stock_entry_id_notnull

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_location_product_id_notnull

              - column:
                  name: movement_type
                  type: varchar(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_movement_type_notnull

              - column:
                  name: reason_id
                  type: uuid

              - column:
                  name: category
                  type: varchar(5)

              - column:
                  name: note
                  type: varchar(500)

              - column:
                  name: storage_moved_quantity
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_storage_moved_quantity_notnull

              - column:
                  name: whole_line_quantity_text
                  type: varchar(200)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_whole_line_quantity_text_notnull

              - column:
                  name: storage_remaining_quantity
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_storage_remaining_quantity_notnull

              - column:
                  name: moved_cost
                  type: numeric(28,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_moved_cost_notnull

              - column:
                  name: storage_moved_breakdown_text
                  type: varchar(200)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_storage_moved_breakdown_text_notnull

              - column:
                  name: storage_remaining_breakdown_text
                  type: varchar(200)
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_storage_remaining_breakdown_text_notnull

              - column:
                  name: document_reference
                  type: varchar(30)

              - column:
                  name: detail_reference
                  type: varchar(30)

              - column:
                  name: unit_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_unit_id_notnull

              - column:
                  name: storage_units_per_user_provided_unit
                  type: bigint
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_storage_units_per_user_provided_unit_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: stock_movement_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

  - changeSet:
      id: add-context-to-stock-movement
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: stock_movement
                columnName: context
      changes:
        - addColumn:
            tableName: stock_movement
            columns:
              - column:
                  name: context
                  type: varchar(200)
      rollback:
        - dropColumn:
            tableName: stock_movement
            columnName: context

  - changeSet:
      id: add-stock-revision-reference-to-stock-movement
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: stock_movement
                columnName: stock_revision_reference
      changes:
        - addColumn:
            tableName: stock_movement
            columns:
              - column:
                  name: stock_revision_reference
                  type: varchar(30)
      rollback:
        - dropColumn:
            tableName: stock_movement
            columnName: stock_revision_reference
