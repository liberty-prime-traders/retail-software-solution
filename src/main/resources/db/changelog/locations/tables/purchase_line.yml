databaseChangeLog:
  - changeSet:
      id: create-purchase-line-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: purchase_line
      changes:
        - createTable:
            tableName: purchase_line
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_purchase_line_reference_number

              - column:
                  name: purchase_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_purchase_id_notnull

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_location_product_id_notnull

              - column:
                  name: user_provided_quantity_ordered
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_user_provided_quantity_ordered_notnull

              - column:
                  name: unit_cost
                  type: decimal(19,4)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_unit_cost_notnull

              - column:
                  name: unit_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_unit_id_notnull

              - column:
                  name: storage_quantity_delivered
                  type: numeric(28, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_storage_quantity_delivered_notnull

              - column:
                  name: storage_quantity_canceled
                  type: numeric(28, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_storage_quantity_canceled_notnull

              - column:
                  name: storage_units_per_unit
                  type: bigint
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_storage_units_per_unit_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

      rollback:
        - dropTable:
            tableName: purchase_line
