databaseChangeLog:
  - changeSet:
      id: create-purchase-line-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: purchase_line
      changes:
        - createTable:
            tableName: purchase_line
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_reference_number_notnull
                    unique: true
                    uniqueConstraintName: purchase_line_reference_number_unique

              - column:
                  name: purchase_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_purchase_id_notnull

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_location_product_id_notnull

              - column:
                  name: quantity_ordered
                  type: decimal(15,3)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_quantity_ordered_notnull

              - column:
                  name: unit_cost
                  type: decimal(15,2)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_unit_cost_notnull

              - column:
                  name: quantity_delivered
                  type: decimal(15,3)
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_quantity_delivered_notnull

              - column:
                  name: quantity_canceled
                  type: decimal(15,3)
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_quantity_canceled_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: raw_quantity_ordered
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_raw_quantity_ordered_notnull

              - column:
                  name: raw_unit_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_raw_unit_id_notnull

              - column:
                  name: raw_quantity_delivered
                  type: numeric(19, 4)
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_raw_quantity_delivered_notnull

              - column:
                  name: raw_quantity_canceled
                  type: numeric(19, 4)
                  defaultValueNumeric: '0'
                  constraints:
                    nullable: false
                    notNullConstraintName: purchase_line_raw_quantity_canceled_notnull
      rollback:
        - dropTable:
            tableName: purchase_line
