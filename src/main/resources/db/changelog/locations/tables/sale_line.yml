databaseChangeLog:
  - changeSet:
      id: create-sale-line-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: sale_line
      changes:
        - createTable:
            tableName: sale_line
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_sale_line_reference_number

              - column:
                  name: sale_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_sale_id_notnull

              - column:
                  name: location_product_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_location_product_id_notnull

              - column:
                  name: user_provided_quantity
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_user_provided_quantity_notnull

              - column:
                  name: unit_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_unit_id_notnull

              - column:
                  name: line_total
                  type: numeric(19, 4)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_line_total_notnull

              - column:
                  name: default_sale_price
                  type: numeric(28, 10)
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_default_sale_price_notnull

              - column:
                  name: storage_units_per_user_provided_unit
                  type: bigint
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_storage_units_per_user_provided_unit_notnull

              - column:
                  name: cogs_total
                  type: numeric(19, 4)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: sale_line_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: sale_line
