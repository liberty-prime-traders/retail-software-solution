databaseChangeLog:
  - changeSet:
      id: add-foreign-key-opening-stock-location-product
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_opening_stock_location_product
      changes:
        - addForeignKeyConstraint:
            baseTableName: opening_stock
            baseColumnNames: location_product_id
            referencedTableName: location_product
            referencedColumnNames: id
            constraintName: fk_opening_stock_location_product
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: opening_stock
            constraintName: fk_opening_stock_location_product
