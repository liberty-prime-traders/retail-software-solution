databaseChangeLog:
  - changeSet:
      id: add-foreign-key-expense-payment-void-expense-payment
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_expense_payment_void_expense_payment
      changes:
        - addForeignKeyConstraint:
            baseTableName: expense_payment_void
            baseColumnNames: expense_payment_id
            referencedTableName: expense_payment
            referencedColumnNames: id
            constraintName: fk_expense_payment_void_expense_payment
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: expense_payment_void
            constraintName: fk_expense_payment_void_expense_payment
