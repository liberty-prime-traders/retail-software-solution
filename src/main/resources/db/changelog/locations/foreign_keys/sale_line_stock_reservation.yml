databaseChangeLog:
  - changeSet:
      id: add-foreign-key-sale-line-stock-reservation-sale
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_slsr_sale
      changes:
        - addForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            baseColumnNames: sale_id
            referencedTableName: sale
            referencedColumnNames: id
            constraintName: fk_slsr_sale
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            constraintName: fk_slsr_sale

  - changeSet:
      id: add-foreign-key-sale-line-stock-reservation-sale-line
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_slsr_sale_line
      changes:
        - addForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            baseColumnNames: sale_line_id
            referencedTableName: sale_line
            referencedColumnNames: id
            constraintName: fk_slsr_sale_line
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            constraintName: fk_slsr_sale_line

  - changeSet:
      id: add-foreign-key-sale-line-stock-reservation-location-product
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_slsr_location_product
      changes:
        - addForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            baseColumnNames: location_product_id
            referencedTableName: location_product
            referencedColumnNames: id
            constraintName: fk_slsr_location_product
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: sale_line_stock_reservation
            constraintName: fk_slsr_location_product
