databaseChangeLog:
  - changeSet:
      id: add-foreign-key-stock-entry-purchase-delivery-line
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_stock_entry_purchase_delivery_line
      changes:
        - addForeignKeyConstraint:
            baseTableName: stock_entry
            baseColumnNames: purchase_delivery_line_id
            referencedTableName: purchase_delivery_line
            referencedColumnNames: id
            constraintName: fk_stock_entry_purchase_delivery_line
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stock_entry
            constraintName: fk_stock_entry_purchase_delivery_line

  - changeSet:
      id: add-foreign-key-stock-entry-location-product
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_stock_entry_location_product
      changes:
        - addForeignKeyConstraint:
            baseTableName: stock_entry
            baseColumnNames: location_product_id
            referencedTableName: location_product
            referencedColumnNames: id
            constraintName: fk_stock_entry_location_product
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stock_entry
            constraintName: fk_stock_entry_location_product
