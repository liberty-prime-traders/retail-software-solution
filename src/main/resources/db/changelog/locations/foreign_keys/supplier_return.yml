databaseChangeLog:
  - changeSet:
      id: add-foreign-key-supplier-return-purchase
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_supplier_return_purchase
      changes:
        - addForeignKeyConstraint:
            baseTableName: supplier_return
            baseColumnNames: purchase_id
            referencedTableName: purchase
            referencedColumnNames: id
            constraintName: fk_supplier_return_purchase
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: supplier_return
            constraintName: fk_supplier_return_purchase

  - changeSet:
      id: add-foreign-key-supplier-return-purchase-delivery
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_supplier_return_purchase_delivery
      changes:
        - addForeignKeyConstraint:
            baseTableName: supplier_return
            baseColumnNames: purchase_delivery_id
            referencedTableName: purchase_delivery
            referencedColumnNames: id
            constraintName: fk_supplier_return_purchase_delivery
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: supplier_return
            constraintName: fk_supplier_return_purchase_delivery
