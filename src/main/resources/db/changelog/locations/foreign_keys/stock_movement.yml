databaseChangeLog:
  - changeSet:
      id: add-foreign-key-stock-movement-stock-item
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_stock_movement_stock_entry
      changes:
        - addForeignKeyConstraint:
            baseTableName: stock_movement
            baseColumnNames: stock_entry_id
            referencedTableName: stock_entry
            referencedColumnNames: id
            constraintName: fk_stock_movement_stock_entry
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: stock_movement
            constraintName: fk_stock_movement_stock_entry
