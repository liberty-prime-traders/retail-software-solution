databaseChangeLog:
  - changeSet:
      id: create-sequence-stock-movement-reference-number
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: seq_stock_movement_reference_number
      changes:
        - createSequence:
            sequenceName: seq_stock_movement_reference_number
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: seq_stock_movement_reference_number
