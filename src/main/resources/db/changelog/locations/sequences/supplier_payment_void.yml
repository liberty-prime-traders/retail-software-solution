databaseChangeLog:
  - changeSet:
      id: create-sequence-supplier-payment-void-reference-number
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: seq_supplier_payment_void_reference_number
      changes:
        - createSequence:
            sequenceName: seq_supplier_payment_void_reference_number
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: seq_supplier_payment_void_reference_number
