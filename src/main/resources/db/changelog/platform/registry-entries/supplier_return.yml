databaseChangeLog:
  - changeSet:
      id: create-entry-for-supplier-return-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: supplier_return
              - column:
                  name: default_prefix
                  value: RTN
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Supplier Return
              - column:
                  name: description
                  value: Table tracking stock returned to suppliers
              - column:
                  name: reference_number
                  valueComputed: "'PTBL' || LPAD(nextval('seq_table_registry_reference_number')::text, 2, '0')"
