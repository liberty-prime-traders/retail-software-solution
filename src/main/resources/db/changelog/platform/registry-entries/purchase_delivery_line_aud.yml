databaseChangeLog:
  - changeSet:
      id: create-entry-for-purchase-delivery-line-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: purchase_delivery_line_aud
              - column:
                  name: default_prefix
                  value: PLLAD
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Purchase Delivery Line Audit
              - column:
                  name: description
                  value: Audit trail for purchase delivery line changes
              - column:
                  name: reference_number
                  valueComputed: "'PTBL' || LPAD(nextval('seq_table_registry_reference_number')::text, 2, '0')"
