databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-reserved-subdomain-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: reserved_subdomain
              - column:
                  name: default_prefix
                  value: DMN
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Reserved Subdomain
              - column:
                  name: description
                  value: Table containing reserved subdomains
              - column:
                  name: reference_number
                  valueComputed: "'PTBL' || LPAD(nextval('seq_table_registry_reference_number')::text, 2, '0')"
