databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-category-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: category
              - column:
                  name: default_prefix
                  value: CTGR
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Category
              - column:
                  name: description
                  value: Table containing product and item categories
              - column:
                  name: reference_number
                  value: PTBL02
