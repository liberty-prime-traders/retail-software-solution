databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-sys-user-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sys_user
              - column:
                  name: default_prefix
                  value: PUSR
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: System User
              - column:
                  name: description
                  value: Table containing system users
              - column:
                  name: reference_number
                  value: PTBL15
