databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-movement-reason-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_movement_reason
              - column:
                  name: default_prefix
                  value: SMRSN
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Stock Movement Reason
              - column:
                  name: description
                  value: Lookup table for stock movement reasons
              - column:
                  name: reference_number
                  valueComputed: "'PTBL' || LPAD(nextval('seq_table_registry_reference_number')::text, 2, '0')"
