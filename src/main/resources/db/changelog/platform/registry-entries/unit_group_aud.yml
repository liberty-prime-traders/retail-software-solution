databaseChangeLog:
  - changeSet:
      id: create-entry-for-unit-group-aud-in-table-registry
      author: system
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: unit_group_aud
              - column:
                  name: default_prefix
                  value: UGAUD
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Unit Group Audit
              - column:
                  name: description
                  value: Audit trail for unit group changes
              - column:
                  name: reference_number
                  value: PTBL31
