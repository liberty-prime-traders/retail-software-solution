databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-job-title-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: job_title
              - column:
                  name: default_prefix
                  value: JTTL
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Job Title
              - column:
                  name: description
                  value: Table containing employee job titles
              - column:
                  name: reference_number
                  value: PTBL05
