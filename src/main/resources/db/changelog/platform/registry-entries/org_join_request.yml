databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-org-join-request-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_join_request
              - column:
                  name: default_prefix
                  value: REQ
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Organization Join Request
              - column:
                  name: description
                  value: Table containing organization join requests
              - column:
                  name: reference_number
                  value: PTBL07
