databaseChangeLog:
  - changeSet:
      id: create-entry-for-payment-method-aud-in-table-registry
      author: system
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: payment_method_aud
              - column:
                  name: default_prefix
                  value: PMAUD
              - column:
                  name: minimum_version_id
                  valueComputed: (SELECT id FROM db_version WHERE version_number = '1.0.0')
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Payment Method Audit
              - column:
                  name: description
                  value: Audit trail for payment method changes
              - column:
                  name: reference_number
                  value: PTBL30
