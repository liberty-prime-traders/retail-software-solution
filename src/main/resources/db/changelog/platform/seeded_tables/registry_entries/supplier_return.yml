databaseChangeLog:
  - changeSet:
      id: create-entry-for-supplier-return-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: supplier_return
              - column:
                  name: default_prefix
                  value: RTN
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Supplier Return
              - column:
                  name: description
                  value: Table tracking stock returned to suppliers
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
