databaseChangeLog:
  - changeSet:
      id: create-entry-for-loan-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: loan
              - column:
                  name: default_prefix
                  value: LOAN
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Loan
              - column:
                  name: description
                  value: Records money the organization borrowed from a lender contact
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
