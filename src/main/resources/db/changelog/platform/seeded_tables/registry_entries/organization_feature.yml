databaseChangeLog:
  - changeSet:
      id: create-entry-for-organization-feature-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: organization_feature
              - column:
                  name: default_prefix
                  value: ORGFT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Organization Feature
              - column:
                  name: description
                  value: Enablement status of a feature for a specific organization
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
