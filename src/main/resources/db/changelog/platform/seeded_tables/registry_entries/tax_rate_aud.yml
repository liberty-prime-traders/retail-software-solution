databaseChangeLog:
  - changeSet:
      id: create-entry-for-tax-rate-aud-in-table-registry
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: tax_rate_aud
              - column:
                  name: default_prefix
                  value: TXRAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Tax Rate Audit
              - column:
                  name: description
                  value: Audit table for tax_rate
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
