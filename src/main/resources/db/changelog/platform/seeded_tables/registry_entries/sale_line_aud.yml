databaseChangeLog:
  - changeSet:
      id: create-entry-for-sale-line-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sale_line_aud
              - column:
                  name: default_prefix
                  value: SLNAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Sale Line Audit
              - column:
                  name: description
                  value: Audit trail for sale line changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
