databaseChangeLog:
  - changeSet:
      id: create-entry-for-unit-value-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: unit_value_aud
              - column:
                  name: default_prefix
                  value: UVAUD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Unit Value Audit
              - column:
                  name: description
                  value: Audit trail for unit value changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
