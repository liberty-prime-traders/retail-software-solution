databaseChangeLog:
  - changeSet:
      id: create-entry-for-product-tax-assignment-aud-in-table-registry
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: product_tax_assignment_aud
              - column:
                  name: default_prefix
                  value: PTAAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Product Tax Assignment Audit
              - column:
                  name: description
                  value: Audit table for product_tax_assignment
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
