databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-authorization-pass-aud-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: authorization_pass_aud
              - column:
                  name: default_prefix
                  value: PASS
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Authorization Pass Audit
              - column:
                  name: description
                  value: Audit table for authorization_pass
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
