databaseChangeLog:
  - changeSet:
      id: create-entry-for-org-expense-batch-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_expense_batch
              - column:
                  name: default_prefix
                  value: OXBT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Organization Expense Batch
              - column:
                  name: description
                  value: Groups organization expenses submitted together or against one source document
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
