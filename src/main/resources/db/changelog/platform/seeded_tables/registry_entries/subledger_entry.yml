databaseChangeLog:
  - changeSet:
      id: create-entry-for-subledger-entry-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: subledger_entry
              - column:
                  name: default_prefix
                  value: SBLDG
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Subledger Entry
              - column:
                  name: description
                  value: Contact-level payable and receivable tracking with running balances
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
