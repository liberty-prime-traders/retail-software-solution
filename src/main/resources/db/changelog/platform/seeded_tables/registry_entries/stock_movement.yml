databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-movement-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_movement
              - column:
                  name: default_prefix
                  value: STKMV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Movement
              - column:
                  name: description
                  value: Table tracking all stock movements including sales, returns, adjustments and transfers
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
