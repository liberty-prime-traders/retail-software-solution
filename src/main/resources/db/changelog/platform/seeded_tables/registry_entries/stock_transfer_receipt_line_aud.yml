databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-receipt-line-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_receipt_line_aud
              - column:
                  name: default_prefix
                  value: STRLA
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Transfer Receipt Line Audit
              - column:
                  name: description
                  value: Audit trail for stock transfer receipt line changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
