databaseChangeLog:
  - changeSet:
      id: create-entry-for-org-expense-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_expense
              - column:
                  name: default_prefix
                  value: OXPN
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Organization Expense
              - column:
                  name: description
                  value: Money spent by the organization that no single location owns
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
