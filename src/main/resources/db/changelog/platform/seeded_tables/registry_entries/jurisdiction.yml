databaseChangeLog:
  - changeSet:
      id: create-entry-for-jurisdiction-in-table-registry
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: jurisdiction
              - column:
                  name: default_prefix
                  value: JR
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Jurisdiction
              - column:
                  name: description
                  value: Table containing geographic and legal jurisdictions
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
