databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-receipt-line-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_receipt_line
              - column:
                  name: default_prefix
                  value: STRCL
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Transfer Receipt Line
              - column:
                  name: description
                  value: Confirmed line item on a stock transfer receipt document
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
