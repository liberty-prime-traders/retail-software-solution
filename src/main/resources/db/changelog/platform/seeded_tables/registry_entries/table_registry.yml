databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-table-registry-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: table_registry
              - column:
                  name: default_prefix
                  value: PTBL
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Table Registry
              - column:
                  name: description
                  value: Registry of all tables in the ezra
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
