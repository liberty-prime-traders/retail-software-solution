databaseChangeLog:
  - changeSet:
      id: create-entry-for-manual-journal-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: manual_journal
              - column:
                  name: default_prefix
                  value: MJ
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Manual Journal
              - column:
                  name: description
                  value: Manually posted ledger journals with a summary, details and optional reversal
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
