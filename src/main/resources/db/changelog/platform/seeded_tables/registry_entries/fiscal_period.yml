databaseChangeLog:
  - changeSet:
      id: create-entry-for-fiscal-period-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: fiscal_period
              - column:
                  name: default_prefix
                  value: FPER
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Fiscal Period
              - column:
                  name: description
                  value: Accounting fiscal periods controlling when ledger entries can be posted
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
