databaseChangeLog:
  - changeSet:
      id: create-entry-for-expense-batch-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: expense_batch
              - column:
                  name: default_prefix
                  value: EXBT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Expense Batch
              - column:
                  name: description
                  value: Groups expenses submitted together or against one source document
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
