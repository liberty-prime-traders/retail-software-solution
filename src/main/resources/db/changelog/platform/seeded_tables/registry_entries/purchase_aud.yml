databaseChangeLog:
  - changeSet:
      id: create-entry-for-purchase-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: purchase_aud
              - column:
                  name: default_prefix
                  value: PCHAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Purchase Audit
              - column:
                  name: description
                  value: Audit trail for purchase changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
