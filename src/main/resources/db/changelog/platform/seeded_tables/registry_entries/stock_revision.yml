databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-revision-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_revision
              - column:
                  name: default_prefix
                  value: STRV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Revision
              - column:
                  name: description
                  value: Links a revised stock entry to its replacement, with the source of the revision and the reason
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
