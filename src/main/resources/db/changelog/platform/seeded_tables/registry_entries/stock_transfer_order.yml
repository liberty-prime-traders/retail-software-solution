databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-order-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_order
              - column:
                  name: default_prefix
                  value: STROD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Stock Transfer Order
              - column:
                  name: description
                  value: Inter-location stock transfer order shared across source and destination
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
