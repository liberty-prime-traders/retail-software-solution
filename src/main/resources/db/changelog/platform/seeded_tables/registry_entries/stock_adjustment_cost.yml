databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-adjustment-cost-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_adjustment_cost
              - column:
                  name: default_prefix
                  value: SADC
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Adjustment Cost
              - column:
                  name: description
                  value: Current and replaced cost of each stock adjustment
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
