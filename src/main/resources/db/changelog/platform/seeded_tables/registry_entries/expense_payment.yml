databaseChangeLog:
  - changeSet:
      id: create-entry-for-expense-payment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: expense_payment
              - column:
                  name: default_prefix
                  value: EXPY
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Expense Payment
              - column:
                  name: description
                  value: Payment made against an expense
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
