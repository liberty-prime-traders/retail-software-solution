databaseChangeLog:
  - changeSet:
      id: create-entry-for-sale-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sale_void
              - column:
                  name: default_prefix
                  value: SLVD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Sale Void
              - column:
                  name: description
                  value: Records of voided sales
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
