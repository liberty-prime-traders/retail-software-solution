databaseChangeLog:
  - changeSet:
      id: create-entry-for-platform-role-assignment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: platform_role_assignment
              - column:
                  name: default_prefix
                  value: PRA
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Platform Role Assignment
              - column:
                  name: description
                  value: Assignment of a platform-level role to a user
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
