databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-org-table-registry-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_table_registry
              - column:
                  name: default_prefix
                  value: TBL
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Organization Table Registry
              - column:
                  name: description
                  value: Organization-level table registry overrides
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
