databaseChangeLog:
  - changeSet:
      id: create-entry-for-expense-type-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: expense_type
              - column:
                  name: default_prefix
                  value: EXTP
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Expense Type
              - column:
                  name: description
                  value: Classifies an expense and constrains its payee and entry points
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
