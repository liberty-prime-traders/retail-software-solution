databaseChangeLog:
  - changeSet:
      id: create-entry-for-purchase-line-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: purchase_line
              - column:
                  name: default_prefix
                  value: PCHLN
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Purchase Line
              - column:
                  name: description
                  value: Table containing line items for purchase orders
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
