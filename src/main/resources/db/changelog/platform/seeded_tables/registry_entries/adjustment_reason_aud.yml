databaseChangeLog:
  - changeSet:
      id: create-entry-for-adjustment-reason-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: adjustment_reason_aud
              - column:
                  name: default_prefix
                  value: ADJAU
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Adjustment Reason Audit
              - column:
                  name: description
                  value: Audit trail for adjustment_reason changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
