databaseChangeLog:
  - changeSet:
      id: create-entry-for-location-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: location_aud
              - column:
                  name: default_prefix
                  value: LCAUD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Location Audit
              - column:
                  name: description
                  value: Audit trail for location changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
