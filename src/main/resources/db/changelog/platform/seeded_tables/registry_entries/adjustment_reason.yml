databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-adjustment-reason-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: adjustment_reason
              - column:
                  name: default_prefix
                  value: ADJR
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Adjustment Reason
              - column:
                  name: description
                  value: Table containing discount and surcharge reasons applicable to sales
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
