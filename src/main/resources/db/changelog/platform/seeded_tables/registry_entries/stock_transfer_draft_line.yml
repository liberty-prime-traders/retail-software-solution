databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-draft-line-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_draft_line
              - column:
                  name: default_prefix
                  value: STDRL
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Transfer Draft Line
              - column:
                  name: description
                  value: Editable draft line on a stock transfer dispatch before dispatch is confirmed
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
