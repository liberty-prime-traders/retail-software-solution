databaseChangeLog:
  - changeSet:
      id: create-entry-for-tax-entry-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: tax_entry_aud
              - column:
                  name: default_prefix
                  value: TXENAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Tax Entry Audit
              - column:
                  name: description
                  value: Audit trail for tax entry changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
