databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-product-category-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: product_category
              - column:
                  name: default_prefix
                  value: PRCT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Product Category
              - column:
                  name: description
                  value: Table containing product categories
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
