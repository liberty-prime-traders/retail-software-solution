databaseChangeLog:
  - changeSet:
      id: create-entry-for-identity-provider-link-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: identity_provider_link
              - column:
                  name: default_prefix
                  value: IDPLK
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Identity Provider Link
              - column:
                  name: description
                  value: Link between a platform user and an external identity provider account
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
