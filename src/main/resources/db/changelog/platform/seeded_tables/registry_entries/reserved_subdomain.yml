databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-reserved-subdomain-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: reserved_subdomain
              - column:
                  name: default_prefix
                  value: DMN
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Reserved Subdomain
              - column:
                  name: description
                  value: Table containing reserved subdomains
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
