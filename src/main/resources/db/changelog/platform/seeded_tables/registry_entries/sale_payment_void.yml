databaseChangeLog:
  - changeSet:
      id: create-entry-for-sale-payment-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sale_payment_void
              - column:
                  name: default_prefix
                  value: SLPV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Sale Payment Void
              - column:
                  name: description
                  value: Records of voided sale payments
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
