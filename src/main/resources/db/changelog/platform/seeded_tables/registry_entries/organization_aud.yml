databaseChangeLog:
  - changeSet:
      id: create-entry-for-organization-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: organization_aud
              - column:
                  name: default_prefix
                  value: OGAUD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Organization Audit
              - column:
                  name: description
                  value: Audit trail for organization changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
