databaseChangeLog:
  - changeSet:
      id: create-entry-for-account-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: account
              - column:
                  name: default_prefix
                  value: ACCT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Account
              - column:
                  name: description
                  value: Chart of accounts entry used for ledger postings
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
