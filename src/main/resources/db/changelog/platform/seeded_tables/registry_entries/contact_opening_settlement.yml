databaseChangeLog:
  - changeSet:
      id: create-entry-for-contact-opening-settlement-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: contact_opening_settlement
              - column:
                  name: default_prefix
                  value: CSET
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Contact Opening Settlement
              - column:
                  name: description
                  value: Money received from or paid to a contact against a pre-live balance
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
