databaseChangeLog:
  - changeSet:
      id: create-entry-for-location-permission-assignment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: location_permission_assignment
              - column:
                  name: default_prefix
                  value: LPA
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Location Permission Assignment
              - column:
                  name: description
                  value: Direct grant of a location-level permission to a user
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
