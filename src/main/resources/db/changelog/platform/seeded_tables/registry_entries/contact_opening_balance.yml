databaseChangeLog:
  - changeSet:
      id: create-entry-for-contact-opening-balance-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: contact_opening_balance
              - column:
                  name: default_prefix
                  value: COB
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Contact Opening Balance
              - column:
                  name: description
                  value: Declared starting receivable or payable balances for contacts
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
