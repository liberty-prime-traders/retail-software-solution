databaseChangeLog:
  - changeSet:
      id: create-entry-for-loan-repayment-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: loan_repayment_void
              - column:
                  name: default_prefix
                  value: LRPV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Loan Repayment Void
              - column:
                  name: description
                  value: Records the voiding of a loan repayment
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
