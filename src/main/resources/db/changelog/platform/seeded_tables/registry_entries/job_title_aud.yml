databaseChangeLog:
  - changeSet:
      id: create-entry-for-job-title-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: job_title_aud
              - column:
                  name: default_prefix
                  value: JTAUD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Job Title Audit
              - column:
                  name: description
                  value: Audit trail for job title changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
