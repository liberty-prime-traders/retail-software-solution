databaseChangeLog:
  - changeSet:
      id: create-entry-for-event-processing-log-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: event_processing_log
              - column:
                  name: default_prefix
                  value: EPLOG
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Event Processing Log
              - column:
                  name: description
                  value: Tracks publish and consumer processing state for transaction events
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
