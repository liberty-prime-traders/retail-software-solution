databaseChangeLog:
  - changeSet:
      id: create-entry-for-fund-movement-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: fund_movement_void
              - column:
                  name: default_prefix
                  value: FMVD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Fund Movement Void
              - column:
                  name: description
                  value: Records voiding a fund movement
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
