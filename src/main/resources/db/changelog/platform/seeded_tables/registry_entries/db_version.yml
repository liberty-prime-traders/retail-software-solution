databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-db-version-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: db_version
              - column:
                  name: default_prefix
                  value: VER
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Database Version
              - column:
                  name: description
                  value: Table tracking database schema versions
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
