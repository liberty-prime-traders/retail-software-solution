databaseChangeLog:
  - changeSet:
      id: create-entry-for-org-permission-assignment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_permission_assignment
              - column:
                  name: default_prefix
                  value: OPA
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Org Permission Assignment
              - column:
                  name: description
                  value: Direct grant of an organization-level permission to a user
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
