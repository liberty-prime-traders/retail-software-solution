databaseChangeLog:
  - changeSet:
      id: create-entry-for-org-expense-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: org_expense_void
              - column:
                  name: default_prefix
                  value: OXVD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Organization Expense Void
              - column:
                  name: description
                  value: Records voiding an organization expense
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
