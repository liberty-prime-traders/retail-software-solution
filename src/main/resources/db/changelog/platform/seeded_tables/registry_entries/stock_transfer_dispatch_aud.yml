databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-dispatch-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_dispatch_aud
              - column:
                  name: default_prefix
                  value: STDSA
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Transfer Dispatch Audit
              - column:
                  name: description
                  value: Audit trail for stock transfer dispatch document changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
