databaseChangeLog:
  - changeSet:
      id: create-entry-for-jurisdiction-tax-type-in-table-registry
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: jurisdiction_tax_type
              - column:
                  name: default_prefix
                  value: JTXTP
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: PLT
              - column:
                  name: display_name
                  value: Jurisdiction Tax Type
              - column:
                  name: description
                  value: Link table associating tax types with the jurisdictions they apply in
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
