databaseChangeLog:
  - changeSet:
      id: create-entry-for-location-product-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: location_product_aud
              - column:
                  name: default_prefix
                  value: LPRAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Location Product Audit
              - column:
                  name: description
                  value: Audit trail for location-specific product configuration changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
