databaseChangeLog:
  - changeSet:
      id: 'create-entry-for-address-in-table-registry'
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: address
              - column:
                  name: default_prefix
                  value: ADR
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Address
              - column:
                  name: description
                  value: Table containing addresses
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
