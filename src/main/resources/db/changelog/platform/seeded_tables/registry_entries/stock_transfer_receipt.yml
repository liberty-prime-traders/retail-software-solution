databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-receipt-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_receipt
              - column:
                  name: default_prefix
                  value: STRCP
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Stock Transfer Receipt
              - column:
                  name: description
                  value: Receipt document held at destination location for a stock transfer
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
