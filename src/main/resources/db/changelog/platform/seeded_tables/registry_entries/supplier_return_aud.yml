databaseChangeLog:
  - changeSet:
      id: create-entry-for-supplier-return-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: supplier_return_aud
              - column:
                  name: default_prefix
                  value: RTNAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Supplier Return Audit
              - column:
                  name: description
                  value: Audit trail for supplier return changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
