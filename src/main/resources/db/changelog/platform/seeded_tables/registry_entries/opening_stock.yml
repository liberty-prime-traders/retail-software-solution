databaseChangeLog:
  - changeSet:
      id: create-entry-for-opening-stock-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: opening_stock
              - column:
                  name: default_prefix
                  value: OPS
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Opening Stock
              - column:
                  name: description
                  value: Declared initial stock quantities for location products
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
