databaseChangeLog:
  - changeSet:
      id: create-entry-for-fund-movement-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: fund_movement
              - column:
                  name: default_prefix
                  value: FMOV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Fund Movement
              - column:
                  name: description
                  value: Records a movement of money between organization accounts, or an owner capital contribution or draw
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
