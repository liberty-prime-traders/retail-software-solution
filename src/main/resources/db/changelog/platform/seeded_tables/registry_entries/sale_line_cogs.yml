databaseChangeLog:
  - changeSet:
      id: create-entry-for-sale-line-cogs-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sale_line_cogs
              - column:
                  name: default_prefix
                  value: SLCG
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Sale Line Cogs
              - column:
                  name: description
                  value: Cost of goods sold recorded per confirmed sale line
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
