databaseChangeLog:
  - changeSet:
      id: create-entry-for-contact-opening-settlement-void-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: contact_opening_settlement_void
              - column:
                  name: default_prefix
                  value: CSETV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_2_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Contact Opening Settlement Void
              - column:
                  name: description
                  value: Records the voiding of a contact opening settlement
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
