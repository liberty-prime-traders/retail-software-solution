databaseChangeLog:
  - changeSet:
      id: create-entry-for-sale-adjustment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: sale_adjustment
              - column:
                  name: default_prefix
                  value: SADJ
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Sale Adjustment
              - column:
                  name: description
                  value: Discount or surcharge applied to a sale or one of its lines
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
