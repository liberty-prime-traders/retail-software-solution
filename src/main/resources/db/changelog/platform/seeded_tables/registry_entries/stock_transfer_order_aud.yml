databaseChangeLog:
  - changeSet:
      id: create-entry-for-stock-transfer-order-aud-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: stock_transfer_order_aud
              - column:
                  name: default_prefix
                  value: STOAD
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Stock Transfer Order Audit
              - column:
                  name: description
                  value: Audit trail for stock transfer order changes
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
