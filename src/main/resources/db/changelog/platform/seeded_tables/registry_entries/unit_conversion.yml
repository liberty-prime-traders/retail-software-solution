databaseChangeLog:
  - changeSet:
      id: create-entry-for-unit-conversion-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: unit_conversion
              - column:
                  name: default_prefix
                  value: UNCV
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: ORG
              - column:
                  name: display_name
                  value: Unit Conversion
              - column:
                  name: description
                  value: Conversion factors between units within a unit group
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
