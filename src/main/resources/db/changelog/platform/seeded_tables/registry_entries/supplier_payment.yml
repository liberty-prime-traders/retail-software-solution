databaseChangeLog:
  - changeSet:
      id: create-entry-for-supplier-payment-in-table-registry
      author: ezra
      changes:
        - insert:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: table_name
                  value: supplier_payment
              - column:
                  name: default_prefix
                  value: SPMT
              - column:
                  name: minimum_version_id
                  valueComputed: ${version_1_id}
              - column:
                  name: schema_level
                  value: LOC
              - column:
                  name: display_name
                  value: Supplier Payment
              - column:
                  name: description
                  value: Records of payments made to suppliers against purchases
              - column:
                  name: reference_number
                  valueComputed: ${table_registry_ref}
