databaseChangeLog:
  - changeSet:
      id: 'add-record-initializer-service-account'
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: sys_user
            columns:
              - column:
                  name: id
                  value: '22222222-2222-2222-2222-222222222222'
              - column:
                  name: okta_id
                  value: 'SERVICE_ACCOUNT_RECORD_INITIALIZER'
              - column:
                  name: reference_number
                  valueComputed: "'PUSR' || LPAD(nextval('seq_sys_user_reference_number')::text, 3, '0')"
              - column:
                  name: local_first_name
                  value: 'Record Initializer'
              - column:
                  name: user_type
                  value: 'S'
