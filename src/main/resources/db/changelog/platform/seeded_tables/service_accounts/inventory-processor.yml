databaseChangeLog:
  - changeSet:
      id: 'add-location-to-organization-sync-service-account'
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: sys_user
            columns:
              - column:
                  name: id
                  value: '44444444-4444-4444-4444-444444444444'
              - column:
                  name: okta_id
                  value: 'INVENTORY_PROCESSOR'
              - column:
                  name: reference_number
                  valueComputed: "'PUSR' || LPAD(nextval('seq_sys_user_reference_number')::text, 2, '0')"
              - column:
                  name: local_first_name
                  value: 'Inventory Processor'
              - column:
                  name: user_type
                  value: 'S'
