databaseChangeLog:
  - changeSet:
      id: 'add-security-monitor-service-account'
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: sys_user
            columns:
              - column:
                  name: id
                  value: '33333333-3333-3333-3333-333333333333'
              - column:
                  name: okta_id
                  value: 'SECURITY_MONITOR'
              - column:
                  name: reference_number
                  valueComputed: "'PUSR' || LPAD(nextval('seq_sys_user_reference_number')::text, 2, '0')"
              - column:
                  name: local_first_name
                  value: 'Security Monitor'
              - column:
                  name: user_type
                  value: 'S'
