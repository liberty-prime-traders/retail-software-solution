databaseChangeLog:
  - include:
      file: ../../shared/procedures/generate_reference_number.yml
      relativeToChangelogFile: true

  - property:
      dbms: postgresql
      name: table_registry_ref
      value: "generate_reference_number('PTBL', 'seq_table_registry_reference_number')"

  - property:
      dbms: postgresql
      name: version_1_id
      value: (SELECT id FROM db_version WHERE version_number = '1.0.0')

  - includeAll:
      path: version_entries
      relativeToChangelogFile: true

  - includeAll:
      path: registry_entries
      relativeToChangelogFile: true
