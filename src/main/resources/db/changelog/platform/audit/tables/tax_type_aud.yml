databaseChangeLog:
  - changeSet:
      id: create-tax-type-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: tax_type_aud
      changes:
        - createTable:
            tableName: tax_type_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: nvarchar2(100)

              - column:
                  name: description
                  type: nvarchar2(500)

              - column:
                  name: calculation_method
                  type: nvarchar2(5)

              - column:
                  name: tax_recovery_type
                  type: nvarchar2(5)

              - column:
                  name: tax_application_level
                  type: nvarchar2(5)

              - column:
                  name: tax_triggers
                  type: nvarchar2(100)

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: tax_type_aud
            columnNames: id, rev
            constraintName: pk_tax_type_aud
      rollback:
        - dropTable:
            tableName: tax_type_aud
