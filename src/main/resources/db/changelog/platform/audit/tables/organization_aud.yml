databaseChangeLog:
  - changeSet:
      id: create-organization-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: organization_aud
      changes:
        - createTable:
            tableName: organization_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: nvarchar2(100)
              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: private
                  type: boolean

              - column:
                  name: current_db_version_id
                  type: uuid

              - column:
                  name: timezone
                  type: nvarchar2(50)

              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: organization_aud
            columnNames: id, rev
            constraintName: pk_organization_aud
      rollback:
        - dropTable:
            tableName: organization_aud
