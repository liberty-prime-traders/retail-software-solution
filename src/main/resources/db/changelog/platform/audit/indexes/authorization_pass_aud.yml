databaseChangeLog:
  - changeSet:
      id: create-index-org-creation-pass-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_authorization_pass_aud_rev
      changes:
        - createIndex:
            indexName: idx_authorization_pass_aud_rev
            tableName: authorization_pass_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_authorization_pass_aud_rev
            tableName: authorization_pass_aud

  - changeSet:
      id: create-index-org-creation-pass-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_authorization_pass_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_authorization_pass_aud_id_rev_partial ON authorization_pass_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_authorization_pass_aud_id_rev_partial
