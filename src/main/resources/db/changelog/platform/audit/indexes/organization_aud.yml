databaseChangeLog:
  - changeSet:
      id: create-index-organization-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_organization_aud_rev
      changes:
        - createIndex:
            indexName: idx_organization_aud_rev
            tableName: organization_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_organization_aud_rev
            tableName: organization_aud

  - changeSet:
      id: create-index-organization-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_organization_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_organization_aud_id_rev_partial ON organization_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_organization_aud_id_rev_partial
