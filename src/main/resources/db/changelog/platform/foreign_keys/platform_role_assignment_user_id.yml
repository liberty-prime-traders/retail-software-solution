databaseChangeLog:
  - changeSet:
      id: add-foreign-key-platform-role-assignment-user-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_platform_role_assignment_user_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: platform_role_assignment
            baseColumnNames: user_id
            referencedTableName: sys_user
            referencedColumnNames: id
            constraintName: fk_platform_role_assignment_user_id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: platform_role_assignment
            constraintName: fk_platform_role_assignment_user_id
