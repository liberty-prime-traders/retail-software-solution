databaseChangeLog:
  - changeSet:
      id: add-foreign-key-identity-provider-link-user-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_identity_provider_link_user_id
      changes:
        - addForeignKeyConstraint:
            baseTableName: identity_provider_link
            baseColumnNames: user_id
            referencedTableName: sys_user
            referencedColumnNames: id
            constraintName: fk_identity_provider_link_user_id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: identity_provider_link
            constraintName: fk_identity_provider_link_user_id
