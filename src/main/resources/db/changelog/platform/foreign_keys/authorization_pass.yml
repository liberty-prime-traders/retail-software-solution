databaseChangeLog:
  - changeSet:
      id: add-fk-authorization-pass-assigned-to-id
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: authorization_pass_assigned_to_id_fk
      changes:
        - addForeignKeyConstraint:
            baseTableName: authorization_pass
            baseColumnNames: assigned_to_id
            referencedTableName: sys_user
            referencedColumnNames: id
            constraintName: authorization_pass_assigned_to_id_fk
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: authorization_pass
            constraintName: authorization_pass_assigned_to_id_fk

  - changeSet:
      id: add-fk-authorization-pass-created-by-id
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: authorization_pass_created_by_id_fk
      changes:
        - addForeignKeyConstraint:
            baseTableName: authorization_pass
            baseColumnNames: created_by_id
            referencedTableName: sys_user
            referencedColumnNames: id
            constraintName: authorization_pass_created_by_id_fk
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: authorization_pass
            constraintName: authorization_pass_created_by_id_fk
