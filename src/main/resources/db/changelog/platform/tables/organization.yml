databaseChangeLog:
  - changeSet:
      id: 'create-organization-table'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organization
      changes:
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: nvarchar2(100)
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_name_notnull
                    unique: true
                    uniqueConstraintName: organization_name_unique

              - column:
                  name: subdomain
                  type: nvarchar2(63)
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_subdomain_notnull
                    unique: true
                    uniqueConstraintName: organization_subdomain_unique

              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: private
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_private_notnull

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: current_db_version_id
                  type: uuid

              - column:
                  name: creation_pass_id
                  type: uuid

              - column:
                  name: schema_name
                  type: nvarchar2(100)
                  constraints:
                    unique: true
                    uniqueConstraintName: organization_schema_name_unique
                    nullable: false
                    notNullConstraintName: organization_schema_name_notnull

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: organization_reference_number_unique
                    nullable: false
                    notNullConstraintName: organization_reference_number_not_null
