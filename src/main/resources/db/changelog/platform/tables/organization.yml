databaseChangeLog:
  - changeSet:
      id: 'create-organization-table'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organization
      changes:
        - createTable:
            tableName: organization
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: nvarchar2(100)
                  constraints:
                    unique: true
                    uniqueConstraintName: organization_name_unique

              - column:
                  name: subdomain
                  type: nvarchar2(63)
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_subdomain_notnull

              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: '0'

              - column:
                  name: schema_name
                  type: nvarchar2(100)
                  constraints:
                    unique: true
                    uniqueConstraintName: organization_schema_name_unique
                    nullable: false
                    notNullConstraintName: organization_schema_name_notnull

  - changeSet:
      id: 'add_reference_number_to_organization'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: organization
                columnName: reference_number
      changes:
        - addColumn:
            tableName: organization
            columns:
              - column:
                  name: reference_number
                  type: nvarchar(30)
                  constraints:
                    unique: true
