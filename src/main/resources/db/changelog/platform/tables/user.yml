databaseChangeLog:
  - changeSet:
      id: 'create-user-table'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
          - tableExists:
              tableName: sys_user
      changes:
        - createTable:
            tableName: sys_user
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: okta_id
                  type: nvarchar2(50)
                  constraints:
                    nullable: false
                    notNullConstraintName: sys_user_okta_id_notnull

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: sys_user_reference_number_unique
                    nullable: false
                    notNullConstraintName: sys_user_reference_number_not_null

              - column:
                  name: created_by_id
                  type: uuid

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: local_first_name
                  type: nvarchar2(100)

              - column:
                  name: local_last_name
                  type: nvarchar2(100)

              - column:
                  name: user_type
                  type: nvarchar2(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: sys_user_user_type_notnull

        - sql:
            sql: |
              ALTER TABLE sys_user
              ADD CONSTRAINT sys_user_created_by_required_for_end_users
              CHECK (user_type = 'S' OR created_by_id IS NOT NULL)
