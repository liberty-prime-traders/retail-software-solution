databaseChangeLog:
  - changeSet:
      id: create-jurisdiction-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: jurisdiction
      changes:
        - createTable:
            tableName: jurisdiction
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: nvarchar2(200)
                  constraints:
                    nullable: false
                    notNullConstraintName: jurisdiction_name_notnull

              - column:
                  name: jurisdiction_type_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: jurisdiction_jurisdiction_type_id_notnull

              - column:
                  name: parent_jurisdiction_id
                  type: uuid

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: jurisdiction_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: jurisdiction_reference_number_unique
                    nullable: false
                    notNullConstraintName: jurisdiction_reference_number_notnull
      rollback:
        - dropTable:
            tableName: jurisdiction
