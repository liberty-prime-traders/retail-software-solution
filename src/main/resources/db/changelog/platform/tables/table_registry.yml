databaseChangeLog:
  - changeSet:
        id: 'create_table_registry_table'
        author: ezra
        changes:
          - createTable:
              tableName: table_registry
              columns:
                - column:
                    name: id
                    type: uuid
                    defaultValueComputed: ${uuid_function}
                    constraints:
                      primaryKey: true

                - column:
                    name: table_name
                    type: nvarchar(100)
                    constraints:
                      nullable: false
                      notNullConstraintName: table_registry_table_name_not_null
                      unique: true
                      uniqueConstraintName: table_registry_table_name_unique

                - column:
                    name: default_prefix
                    type: nvarchar(5)
                    constraints:
                      nullable: false
                      notNullConstraintName: table_registry_default_prefix_not_null
                      unique: true
                      uniqueConstraintName: table_registry_default_prefix_unique

                - column:
                    name: minimum_version_id
                    type: uuid
                    constraints:
                      nullable: false
                      notNullConstraintName: table_registry_minimum_version_id_not_null

                - column:
                    name: schema_level
                    type: nvarchar(5)
                    constraints:
                      nullable: false
                      notNullConstraintName: table_registry_schema_level_not_null

                - column:
                    name: display_name
                    type: nvarchar(255)
                    constraints:
                        nullable: false
                        notNullConstraintName: table_registry_display_name_not_null
                        unique: true
                        uniqueConstraintName: table_registry_display_name_unique

                - column:
                    name: description
                    type: nvarchar(1000)
                    constraints:
                        nullable: false
                        notNullConstraintName: table_registry_description_not_null

                - column:
                    name: user_facing
                    type: boolean
                    defaultValueBoolean: false

                - column:
                    name: validated
                    type: boolean
                    defaultValueBoolean: false
