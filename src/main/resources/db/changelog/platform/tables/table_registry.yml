databaseChangeLog:
  - changeSet:
      id: 'create_table_registry_table'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: table_registry
      changes:
        - createTable:
            tableName: table_registry
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: table_name
                  type: nvarchar
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_table_name_not_null

              - column:
                  name: default_prefix
                  type: nvarchar
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_default_prefix_not_null

              - column:
                  name: minimum_version_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_minimum_version_id_not_null

              - column:
                  name: schema_level
                  type: nvarchar
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_schema_level_not_null

              - column:
                  name: display_name
                  type: nvarchar
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_display_name_not_null

              - column:
                  name: description
                  type: nvarchar
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_description_not_null

              - column:
                  name: user_facing
                  type: boolean
                  defaultValueBoolean: false

              - column:
                  name: next_number
                  type: bigint
                  defaultValueNumeric: '1'

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueComputed: ${now}

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: table_registry_created_by_id_not_null

  - changeSet:
      id: 'add_reference_number_to_table_registry'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: table_registry
                columnName: reference_number
      changes:
        - addColumn:
            tableName: table_registry
            columns:
              - column:
                  name: reference_number
                  type: nvarchar(30)
                  constraints:
                    unique: true
