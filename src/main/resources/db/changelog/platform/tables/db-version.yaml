databaseChangeLog:
  - changeSet:
      id: 'create-db-version-table'
      author: adongo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: db_version
      changes:
        - createTable:
            tableName: db_version
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: version_number
                  type: nvarchar2(15)
                  constraints:
                    nullable: false
                    notNullConstraintName: db_version_version_number_notnull
                    unique: true
                    uniqueConstraintName: uq_db_version_version_number

              - column:
                  name: sequence_number
                  type: BIGINT
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_db_version_sequence_number

              - column:
                  name: prev_version_id
                  type: uuid
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_db_version_prev_version_id

              - column:
                  name: activated_on
                  type: timestamptz
