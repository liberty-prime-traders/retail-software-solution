databaseChangeLog:
  - changeSet:
      id: 'create-db-version-table'
      author: adongo
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: db_version
      changes:
        - createTable:
            tableName: db_version
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: version_number
                  type: nvarchar(15)
                  constraints:
                    nullable: false
                    notNullConstraintName: db_version_version_number_notnull

              - column:
                  name: sequence_number
                  type: BIGINT
                  constraints:
                    nullable: false
                    notNullConstraintName: db_version_sequence_number_notnull

              - column:
                  name: prev_version_id
                  type: uuid

              - column:
                  name: activated_on
                  type: timestamptz

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: db_version_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

  - changeSet:
      id: 'add_reference_number_to_db_version'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: db_version
                columnName: reference_number
      changes:
        - addColumn:
            tableName: db_version
            columns:
              - column:
                  name: reference_number
                  type: nvarchar(30)
                  constraints:
                    unique: true