databaseChangeLog:
  - property:
      dbms: postgresql
      name: uuid_function
      value: gen_random_uuid()

  - property:
      dbms: postgresql
      name: now
      value: current_timestamp

  - property:
      dbms: postgresql
      name: today
      value: current_date

  - includeAll:
      path: tables
      relativeToChangelogFile: true

  - includeAll:
      path: sequences
      relativeToChangelogFile: true

  - include:
      file: ../shared/procedures/get_next_sequence_values.yml
      relativeToChangelogFile: true

  - includeAll:
      path: version-entries
      relativeToChangelogFile: true

  - includeAll:
      path: registry-entries
      relativeToChangelogFile: true
