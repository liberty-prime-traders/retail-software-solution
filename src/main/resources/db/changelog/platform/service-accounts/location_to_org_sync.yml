databaseChangeLog:
  - changeSet:
      id: 'add-location-to-organization-sync-service-account'
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: sys_user
            columns:
              - column:
                  name: id
                  value: '11111111-1111-1111-1111-111111111111'
              - column:
                  name: okta_id
                  value: 'SERVICE_ACCOUNT_LOCATION_TO_ORG_SYNC'
              - column:
                  name: reference_number
                  valueComputed: "'PUSR' || LPAD(nextval('seq_sys_user_reference_number')::text, 2, '0')"
              - column:
                  name: local_first_name
                  value: 'Location to Org Sync'
              - column:
                  name: user_type
                  value: 'S'
