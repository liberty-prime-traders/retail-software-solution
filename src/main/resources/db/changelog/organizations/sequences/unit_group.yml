databaseChangeLog:
  - changeSet:
      id: 'create-sequence-unit-group-reference-number'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: seq_unit_group_reference_number
      changes:
        - createSequence:
            sequenceName: seq_unit_group_reference_number
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: seq_unit_group_reference_number
