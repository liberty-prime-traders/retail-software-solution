databaseChangeLog:
  - changeSet:
      id: 'create-sequence-org-table-registry-reference-number'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - sequenceExists:
                sequenceName: seq_org_table_registry_reference_number
      changes:
        - createSequence:
            sequenceName: seq_org_table_registry_reference_number
            startValue: 1
            incrementBy: 1
      rollback:
        - dropSequence:
            sequenceName: seq_org_table_registry_reference_number
