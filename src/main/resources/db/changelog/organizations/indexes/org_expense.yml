databaseChangeLog:
  - changeSet:
      id: create-index-org-expense-batch-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_org_expense_batch_id
      changes:
        - createIndex:
            indexName: idx_org_expense_batch_id
            tableName: org_expense
            columns:
              - column:
                  name: batch_id
      rollback:
        - dropIndex:
            indexName: idx_org_expense_batch_id
            tableName: org_expense

