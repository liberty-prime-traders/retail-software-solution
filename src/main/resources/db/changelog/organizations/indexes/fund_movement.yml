databaseChangeLog:
  - changeSet:
      id: create-index-fund-movement-created-on-id
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_fund_movement_created_on_id
      changes:
        - createIndex:
            indexName: idx_fund_movement_created_on_id
            tableName: fund_movement
            columns:
              - column:
                  name: created_on
                  descending: true
              - column:
                  name: id
                  descending: true
      rollback:
        - dropIndex:
            indexName: idx_fund_movement_created_on_id
            tableName: fund_movement
