        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_org_expense_payment_payment_method_id
      changes:
        - createIndex:
            indexName: idx_org_expense_payment_payment_method_id
            tableName: org_expense_payment
            columns:
              - column:
                  name: payment_method_id
      rollback:
        - dropIndex:
            indexName: idx_org_expense_payment_payment_method_id
            tableName: org_expense_payment
