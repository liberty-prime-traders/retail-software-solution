  - changeSet:
      id: 'create-gin-index-product-combined-search-trgm'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_product_combined_search_gin_trgm
      changes:
        - sql:
            sql: CREATE INDEX idx_product_combined_search_gin_trgm ON product USING gin ((LOWER(name) || ' ' || LOWER(COALESCE(description, ''))) gin_trgm_ops);
      rollback:
        - dropIndex:
            tableName: product
            indexName: idx_product_combined_search_gin_trgm
