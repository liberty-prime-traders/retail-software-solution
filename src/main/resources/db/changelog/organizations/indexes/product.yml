  - changeSet:
      id: 'create-index-product-reference-number-pattern'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_product_reference_number_pattern
      changes:
        - sql:
            sql: CREATE INDEX idx_product_reference_number_pattern ON product (reference_number text_pattern_ops);
      rollback:
        - dropIndex:
            tableName: product
            indexName: idx_product_reference_number_pattern

  - changeSet:
      id: 'create-gin-index-product-search-vector'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
