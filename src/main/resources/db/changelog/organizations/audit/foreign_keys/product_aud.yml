databaseChangeLog:
  - changeSet:
      id: add-foreign-key-product-aud-revinfo
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_product_aud_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: product_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_product_aud_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: product_aud
            constraintName: fk_product_aud_revinfo

  - changeSet:
      id: add-foreign-key-product-aud-revend
      author: ezra
      labels: 1.0.0
      preConditions:
          - onFail: MARK_RAN
          - not:
              foreignKeyConstraintExists:
              foreignKeyName: fk_product_aud_revend_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: product_aud
            baseColumnNames: revend
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_product_aud_revend_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: product_aud
            constraintName: fk_product_aud_revend_revinfo
