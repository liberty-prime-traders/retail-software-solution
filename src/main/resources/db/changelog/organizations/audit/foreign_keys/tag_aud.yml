databaseChangeLog:
  - changeSet:
      id: add-foreign-key-tag-aud-revinfo
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_tag_aud_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: tag_aud
            baseColumnNames: rev
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_tag_aud_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: tag_aud
            constraintName: fk_tag_aud_revinfo

  - changeSet:
      id: add-foreign-key-tag-aud-revend
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_tag_aud_revend_revinfo
      changes:
        - addForeignKeyConstraint:
            baseTableName: tag_aud
            baseColumnNames: revend
            referencedTableName: revinfo
            referencedColumnNames: rev
            constraintName: fk_tag_aud_revend_revinfo
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: tag_aud
            constraintName: fk_tag_aud_revend_revinfo
