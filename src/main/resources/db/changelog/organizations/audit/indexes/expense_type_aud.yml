databaseChangeLog:
  - changeSet:
      id: create-index-expense-type-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_expense_type_aud_rev
      changes:
        - createIndex:
            indexName: idx_expense_type_aud_rev
            tableName: expense_type_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_expense_type_aud_rev
            tableName: expense_type_aud

  - changeSet:
      id: create-index-expense-type-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_expense_type_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_expense_type_aud_id_rev_partial ON expense_type_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_expense_type_aud_id_rev_partial
