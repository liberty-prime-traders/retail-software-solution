databaseChangeLog:
  - changeSet:
      id: create-index-unit-conversion-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_unit_conversion_aud_rev
      changes:
        - createIndex:
            indexName: idx_unit_conversion_aud_rev
            tableName: unit_conversion_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_unit_conversion_aud_rev
            tableName: unit_conversion_aud

  - changeSet:
      id: create-index-unit-conversion-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_unit_conversion_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_unit_conversion_aud_id_rev_partial ON unit_conversion_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_unit_conversion_aud_id_rev_partial
