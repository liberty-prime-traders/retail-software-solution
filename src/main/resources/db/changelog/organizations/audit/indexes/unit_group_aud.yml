databaseChangeLog:
  - changeSet:
      id: create-index-unit-group-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_unit_group_aud_rev
      changes:
        - createIndex:
            indexName: idx_unit_group_aud_rev
            tableName: unit_group_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_unit_group_aud_rev
            tableName: unit_group_aud

  - changeSet:
      id: create-index-unit-group-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_unit_group_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_unit_group_aud_id_rev_partial ON unit_group_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_unit_group_aud_id_rev_partial
