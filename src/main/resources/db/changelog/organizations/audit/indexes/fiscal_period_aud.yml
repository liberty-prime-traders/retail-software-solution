databaseChangeLog:
  - changeSet:
      id: create-index-fiscal-period-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_fiscal_period_aud_rev
      changes:
        - createIndex:
            indexName: idx_fiscal_period_aud_rev
            tableName: fiscal_period_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_fiscal_period_aud_rev
            tableName: fiscal_period_aud

  - changeSet:
      id: create-index-fiscal-period-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - indexExists:
                indexName: idx_fiscal_period_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_fiscal_period_aud_id_rev_partial ON fiscal_period_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_fiscal_period_aud_id_rev_partial
