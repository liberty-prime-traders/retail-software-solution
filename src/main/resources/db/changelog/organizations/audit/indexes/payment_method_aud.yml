databaseChangeLog:
  - changeSet:
      id: create-index-payment-method-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_payment_method_aud_rev
      changes:
        - createIndex:
            indexName: idx_payment_method_aud_rev
            tableName: payment_method_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_payment_method_aud_rev
            tableName: payment_method_aud

  - changeSet:
      id: create-index-payment-method-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_payment_method_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_payment_method_aud_id_rev_partial ON payment_method_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_payment_method_aud_id_rev_partial
