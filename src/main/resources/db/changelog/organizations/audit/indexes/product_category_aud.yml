databaseChangeLog:
  - changeSet:
      id: create-index-product-category-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_product_category_aud_rev
      changes:
        - createIndex:
            indexName: idx_product_category_aud_rev
            tableName: product_category_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_product_category_aud_rev
            tableName: product_category_aud

  - changeSet:
      id: create-index-product-category-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_product_category_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_product_category_aud_id_rev_partial ON product_category_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_product_category_aud_id_rev_partial
