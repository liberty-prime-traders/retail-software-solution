databaseChangeLog:
  - changeSet:
      id: create-index-job-title-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_job_title_aud_rev
      changes:
        - createIndex:
            indexName: idx_job_title_aud_rev
            tableName: job_title_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_job_title_aud_rev
            tableName: job_title_aud

  - changeSet:
      id: create-index-job-title-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_job_title_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_job_title_aud_id_rev_partial ON job_title_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_job_title_aud_id_rev_partial
