databaseChangeLog:
  - changeSet:
      id: create-index-contact-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_contact_aud_rev
      changes:
        - createIndex:
            indexName: idx_contact_aud_rev
            tableName: contact_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_contact_aud_rev
            tableName: contact_aud

  - changeSet:
      id: create-index-contact-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_contact_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_contact_aud_id_rev_partial ON contact_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_contact_aud_id_rev_partial
