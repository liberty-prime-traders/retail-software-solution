databaseChangeLog:
  - changeSet:
      id: create-index-tax-rate-aud-rev
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_tax_rate_aud_rev
      changes:
        - createIndex:
            indexName: idx_tax_rate_aud_rev
            tableName: tax_rate_aud
            columns:
              - column:
                  name: rev
      rollback:
        - dropIndex:
            indexName: idx_tax_rate_aud_rev
            tableName: tax_rate_aud

  - changeSet:
      id: create-index-tax-rate-aud-id-rev-partial
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_tax_rate_aud_id_rev_partial
      changes:
        - sql:
            sql: CREATE INDEX idx_tax_rate_aud_id_rev_partial ON tax_rate_aud (id, rev) WHERE revend IS NULL
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_tax_rate_aud_id_rev_partial
