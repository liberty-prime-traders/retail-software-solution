databaseChangeLog:
  - changeSet:
      id: create-account-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: account_aud
      changes:
        - createTable:
            tableName: account_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: nvarchar2(150)

              - column:
                  name: is_active
                  type: boolean

              - column:
                  name: revend
                  type: bigint

              - column:
                  name: revend_tstmp
                  type: timestamp

        - addPrimaryKey:
            tableName: account_aud
            columnNames: id, rev
            constraintName: pk_account_aud
      rollback:
        - dropTable:
            tableName: account_aud
