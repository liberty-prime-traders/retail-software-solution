databaseChangeLog:
  - changeSet:
      id: create-adjustment-reason-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: adjustment_reason_aud
      changes:
        - createTable:
            tableName: adjustment_reason_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
              - column:
                  name: code
                  type: varchar(5)
              - column:
                  name: direction
                  type: varchar(5)
              - column:
                  name: system_defined
                  type: boolean
              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: adjustment_reason_aud
            columnNames: id, rev
            constraintName: pk_adjustment_reason_aud
      rollback:
        - dropTable:
            tableName: adjustment_reason_aud
