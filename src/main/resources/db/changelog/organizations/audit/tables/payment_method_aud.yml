databaseChangeLog:
  - changeSet:
      id: create-payment-method-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: payment_method_aud
      changes:
        - createTable:
            tableName: payment_method_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: nvarchar2(100)
              - column:
                  name: description
                  type: nvarchar2(1000)
              - column:
                  name: account_code
                  type: nvarchar2(50)
              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: payment_method_aud
            columnNames: id, rev
            constraintName: pk_payment_method_aud
      rollback:
        - dropTable:
            tableName: payment_method_aud
