databaseChangeLog:
  - changeSet:
      id: create-location-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: location_aud
      changes:
        - createTable:
            tableName: location_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: location_type
                  type: nvarchar2(5)
              - column:
                  name: name
                  type: nvarchar2(100)
              - column:
                  name: description
                  type: nvarchar2(1000)
              - column:
                  name: schema_name
                  type: nvarchar2(100)
              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: location_aud
            columnNames: id, rev
            constraintName: pk_location_aud
      rollback:
        - dropTable:
            tableName: location_aud
