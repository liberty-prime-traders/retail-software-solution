databaseChangeLog:
  - changeSet:
      id: create-unit-group-aud-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: unit_group_aud
      changes:
        - createTable:
            tableName: unit_group_aud
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: rev
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: revtype
                  type: smallint
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: nvarchar2(5)

              - column:
                  name: system_defined
                  type: boolean

              - column:
                  name: name
                  type: nvarchar2(100)

              - column:
                  name: description
                  type: nvarchar2(400)
              - column:
                  name: revend
                  type: bigint
              - column:
                  name: revend_tstmp
                  type: timestamp
        - addPrimaryKey:
            tableName: unit_group_aud
            columnNames: id, rev
            constraintName: pk_unit_group_aud
      rollback:
        - dropTable:
            tableName: unit_group_aud
