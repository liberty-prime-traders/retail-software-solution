databaseChangeLog:
  - changeSet:
      id: seed-stock-movement-reason-COUNT_CORRECTION
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: stock_movement_reason
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: reference_number
                  valueComputed: "'SMRSN' || LPAD(nextval('seq_stock_movement_reason_reference_number')::text, 2, '0')"
              - column:
                  name: code
                  value: COUNT_CORRECTION
              - column:
                  name: name
                  value: Count Correction
              - column:
                  name: description
                  value: Adjustment to reconcile physical stock count with system records
              - column:
                  name: system_defined
                  valueBoolean: 'true'
              - column:
                  name: created_by_id
                  value: '22222222-2222-2222-2222-222222222222'
