databaseChangeLog:
  - changeSet:
      id: seed-stock-item-source-TRANSFER_IN
      author: ezra
      labels: 1.0.0
      changes:
        - insert:
            tableName: stock_item_source
            columns:
              - column:
                  name: id
                  valueComputed: ${uuid_function}
              - column:
                  name: reference_number
                  valueComputed: "'SIS' || LPAD(nextval('seq_stock_item_source_reference_number')::text, 2, '0')"
              - column:
                  name: code
                  value: TI
              - column:
                  name: name
                  value: Transfer In
              - column:
                  name: description
                  value: Stock transferred in from another location
              - column:
                  name: system_defined
                  valueBoolean: 'true'
              - column:
                  name: created_by_id
                  value: '22222222-2222-2222-2222-222222222222'
