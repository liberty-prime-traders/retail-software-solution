databaseChangeLog:
  - changeSet:
      id: add-fk-account-parent-account-code
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: account_parent_account_code_fk
      changes:
        - addForeignKeyConstraint:
            baseTableName: account
            baseColumnNames: parent_account_code
            referencedTableName: account
            referencedColumnNames: code
            constraintName: account_parent_account_code_fk
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: account
            constraintName: account_parent_account_code_fk
