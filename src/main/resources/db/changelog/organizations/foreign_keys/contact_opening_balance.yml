databaseChangeLog:
  - changeSet:
      id: add-foreign-key-contact-opening-balance-contact-reference-number
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_contact_opening_balance_contact_reference_number
      changes:
        - addForeignKeyConstraint:
            baseTableName: contact_opening_balance
            baseColumnNames: contact_reference_number
            referencedTableName: contact
            referencedColumnNames: reference_number
            constraintName: fk_contact_opening_balance_contact_reference_number
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: contact_opening_balance
            constraintName: fk_contact_opening_balance_contact_reference_number
