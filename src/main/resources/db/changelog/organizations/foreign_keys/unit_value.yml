databaseChangeLog:
  - changeSet:
      id: add-foreign-key-unit-value-unit-group
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_unit_value_unit_group
      changes:
        - addForeignKeyConstraint:
            baseTableName: unit_value
            baseColumnNames: unit_group_id
            referencedTableName: unit_group
            referencedColumnNames: id
            constraintName: fk_unit_value_unit_group
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: unit_value
            constraintName: fk_unit_value_unit_group

  - changeSet:
      id: add-foreign-key-unit-value-base-unit
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - foreignKeyConstraintExists:
                foreignKeyName: fk_unit_value_base_unit
      changes:
        - addForeignKeyConstraint:
            baseTableName: unit_value
            baseColumnNames: base_unit
            referencedTableName: unit_value
            referencedColumnNames: id
            constraintName: fk_unit_value_base_unit
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: unit_value
            constraintName: fk_unit_value_base_unit
