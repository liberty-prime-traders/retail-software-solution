databaseChangeLog:
  - changeSet:
      id: 'create-organization-admin-table'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organization_admin
      changes:
        - createTable:
            tableName: organization_admin
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_admin_user_id_notnull

              - column:
                  name: end_on
                  type: timestamptz

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_organization_admin_reference_number
                    nullable: false
                    notNullConstraintName: organization_admin_reference_number_not_null

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
                  constraints:
                      nullable: false
                      notNullConstraintName: organization_admin_created_at_not_null

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_admin_created_by_id_not_null
