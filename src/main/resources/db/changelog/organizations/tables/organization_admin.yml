databaseChangeLog:
  - changeSet:
      id: 'create-organization-admin-table'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organization_admin
      changes:
        - createTable:
            tableName: organization_admin
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_admin_user_id_notnull

              - column:
                  name: start_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: end_on
                  type: timestamptz

  - changeSet:
      id: 'add_reference_number_to_organization_admin'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: organization_admin
                columnName: reference_number
      changes:
        - addColumn:
            tableName: organization_admin
            columns:
              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
