databaseChangeLog:
  - changeSet:
      id: 'create-address-table'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
          - tableExists:
              tableName: address
      changes:
        - createTable:
            tableName: address
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: line1
                  type: nvarchar2(100)

              - column:
                  name: line2
                  type: nvarchar2(50)

              - column:
                  name: line3
                  type: nvarchar2(30)

              - column:
                  name: state
                  type: nvarchar2(100)

              - column:
                  name: postal_code
                  type: nvarchar2(10)

              - column:
                  name: country
                  type: nvarchar2(100)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: address_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_address_reference_number
                    nullable: false
                    notNullConstraintName: address_reference_number_not_null
