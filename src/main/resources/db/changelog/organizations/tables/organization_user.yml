databaseChangeLog:
  - changeSet:
      id: 'create-organization-user-table'
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: organization_user
      changes:
        - createTable:
            tableName: organization_user
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: organization_user_user_id_notnull

              - column:
                  name: start_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: end_on
                  type: timestamptz

              - column:
                  name: join_request_id
                  type: uuid

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
