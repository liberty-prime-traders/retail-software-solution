databaseChangeLog:
  - changeSet:
      id: 'create-product-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: product
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_category_id_notnull

              - column:
                  name: name
                  type: nvarchar2

              - column:
                  name: description
                  type: nvarchar2

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: '0'

  - changeSet:
      id: 'add_reference_number_to_product'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: product
                columnName: reference_number
      changes:
        - addColumn:
            tableName: product
            columns:
              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true