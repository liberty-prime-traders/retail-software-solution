databaseChangeLog:
  - changeSet:
      id: 'create-product-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: product
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: category_id
                  type: uuid

              - column:
                  name: name
                  type: nvarchar2(100)

              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: cursor
                  type: bigserial

              - column:
                  name: base_unit_id
                  type: uuid
                  constraints:
                      nullable: false
                      notNullConstraintName: product_base_unit_id_notnull

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: product_reference_number_unique
                    nullable: false
                    notNullConstraintName: product_reference_number_not_null

              - column:
                  name: status
                  type: nvarchar2(5)
                  defaultValue: A
                  constraints:
                    nullable: false
                    notNullConstraintName: product_status_notnull

              - column:
                  name: product_group_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_group_id_notnull

              - column:
                  name: search_vector
                  type: tsvector

  - changeSet:
      id: 'create-product-search-vector-trigger'
      author: ezra
      labels: 1.0.0
      changes:
        - sql:
            sql: |
              CREATE OR REPLACE FUNCTION update_product_search_vector()
              RETURNS trigger AS $$
              BEGIN
                NEW.search_vector := to_tsvector('english', COALESCE(NEW.name, '') || ' ' || COALESCE(NEW.description, ''));
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;

              CREATE TRIGGER trigger_update_product_search_vector
              BEFORE INSERT OR UPDATE OF name, description ON product
              FOR EACH ROW
              EXECUTE FUNCTION update_product_search_vector();
      rollback:
        - sql:
            sql: |
              DROP TRIGGER IF EXISTS trigger_update_product_search_vector ON product;
              DROP FUNCTION IF EXISTS update_product_search_vector();
