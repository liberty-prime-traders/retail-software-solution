databaseChangeLog:
  - changeSet:
      id: 'create-product-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: product
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: category_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_category_id_notnull

              - column:
                  name: name
                  type: nvarchar2

              - column:
                  name: description
                  type: nvarchar2

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: cursor
                  type: bigserial

              - column:
                  name: base_unit_id
                  type: uuid
                  constraints:
                      nullable: false
                      notNullConstraintName: product_base_unit_id_notnull
