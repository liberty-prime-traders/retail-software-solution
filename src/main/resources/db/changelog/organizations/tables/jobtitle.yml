databaseChangeLog:
  - changeSet:
      id: 'create-job-title-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: job_title
      changes:
        - createTable:
            tableName: job_title
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: value
                  type: nvarchar2

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: job_title_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: '0'

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: job_title_reference_number_unique
                    nullable: false
                    notNullConstraintName: job_title_reference_number_not_null
