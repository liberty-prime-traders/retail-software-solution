databaseChangeLog:
  - changeSet:
      id: create-manual-journal-table
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: manual_journal
      changes:
        - createTable:
            tableName: manual_journal
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: nvarchar2(20)
                  constraints:
                    nullable: false
                    notNullConstraintName: manual_journal_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_manual_journal_reference_number

              - column:
                  name: summary
                  type: text
                  constraints:
                    nullable: false
                    notNullConstraintName: manual_journal_summary_notnull

              - column:
                  name: details
                  type: text

              - column:
                  name: posting_date
                  type: date
                  constraints:
                    nullable: false
                    notNullConstraintName: manual_journal_posting_date_notnull

              - column:
                  name: reversal_of_manual_journal_id
                  type: uuid
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_manual_journal_reversal_of_manual_journal_id

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: manual_journal_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: manual_journal
