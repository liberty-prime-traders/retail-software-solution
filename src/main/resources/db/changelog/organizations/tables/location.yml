databaseChangeLog:
  - changeSet:
      id: "create-location-table"
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: location
      changes:
        - createTable:
            tableName: location
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: location_type
                  type: nvarchar2(5)

              - column:
                  name: name
                  type: nvarchar2(100)

              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: schema_name
                  type: nvarchar2(100)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: location_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: timezone
                  type: nvarchar2(50)

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: uq_location_reference_number
                    nullable: false
                    notNullConstraintName: location_reference_number_not_null
