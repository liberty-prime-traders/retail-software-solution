databaseChangeLog:
  - changeSet:
      id: "create-location-table"
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: location
      changes:
        - createTable:
            tableName: location
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: location_type
                  type: nvarchar2(5)

              - column:
                  name: name
                  type: nvarchar2(100)

              - column:
                  name: description
                  type: nvarchar2(1000)

              - column:
                  name: schema_name
                  type: nvarchar2(100)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: location_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: predecessor_of_id
                  type: uuid

              - column:
                  name: usage_count
                  type: bigint
                  defaultValueNumeric: "0"

  - changeSet:
      id: 'add_reference_number_to_location'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: location
                columnName: reference_number
      changes:
        - addColumn:
            tableName: location
            columns:
              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
