databaseChangeLog:
  - changeSet:
      id: 'create-location-admin-table'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: location_admin
      changes:
        - createTable:
            tableName: location_admin
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: admin_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: location_admin_admin_id_notnull

              - column:
                  name: location_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: location_admin_location_id_notnull

              - column:
                  name: start_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: end_on
                  type: timestamptz
