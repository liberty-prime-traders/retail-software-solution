databaseChangeLog:
  - changeSet:
      id: 'add_reference_number_to_unit_value'
      author: adongo
      labels: 1.0.1
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: unit_value
                columnName: reference_number
      changes:
        - addColumn:
            tableName: unit_value
            columns:
              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
