databaseChangeLog:
  - changeSet:
      id: 'create-product-category-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: product_category
      changes:
        - createTable:
            tableName: product_category
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: category_name
                  type: nvarchar2(50)

              - column:
                  name: description
                  type: nvarchar2(400)

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: product_category_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: product_category_reference_number_unique
                    nullable: false
                    notNullConstraintName: product_category_reference_number_not_null
