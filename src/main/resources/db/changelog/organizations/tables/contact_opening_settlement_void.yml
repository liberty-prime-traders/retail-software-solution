databaseChangeLog:
  - changeSet:
      id: create-contact-opening-settlement-void-table
      author: ezra
      labels: 2.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: contact_opening_settlement_void
      changes:
        - createTable:
            tableName: contact_opening_settlement_void
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: contact_opening_settlement_void_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_contact_opening_settlement_void_reference_number

              - column:
                  name: settlement_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: contact_opening_settlement_void_settlement_id_notnull
                    unique: true
                    uniqueConstraintName: uq_contact_opening_settlement_void_settlement_id

              - column:
                  name: void_date
                  type: date
                  constraints:
                    nullable: false
                    notNullConstraintName: contact_opening_settlement_void_void_date_notnull

              - column:
                  name: reason
                  type: text

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: contact_opening_settlement_void_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: contact_opening_settlement_void
