databaseChangeLog:
  - changeSet:
      id: 'create-unit-value-table'
      author: kenneth
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: unit_value
      changes:
        - createTable:
            tableName: unit_value
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: nvarchar2(100)
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_name_notnull

              - column:
                  name: code
                  type: nvarchar2(5)
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_code_notnull

              - column:
                  name: description
                  type: nvarchar2

              - column:
                  name: unit_group_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_unit_group_id_notnull

              - column:
                  name: base_unit
                  type: uuid

              - column:
                  name: conversion_factor
                  type: decimal

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: unit_value_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: reference_number
                  type: nvarchar2(30)
                  constraints:
                    unique: true
                    uniqueConstraintName: unit_value_reference_number_unique
                    nullable: false
                    notNullConstraintName: unit_value_reference_number_not_null
