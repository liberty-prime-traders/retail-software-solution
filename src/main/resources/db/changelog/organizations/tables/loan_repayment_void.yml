databaseChangeLog:
  - changeSet:
      id: create-loan-repayment-void-table
      author: ezra
      labels: 1.0.0
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: loan_repayment_void
      changes:
        - createTable:
            tableName: loan_repayment_void
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: reference_number
                  type: varchar(30)
                  constraints:
                    nullable: false
                    notNullConstraintName: loan_repayment_void_reference_number_notnull
                    unique: true
                    uniqueConstraintName: uq_loan_repayment_void_reference_number

              - column:
                  name: loan_repayment_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: loan_repayment_void_loan_repayment_id_notnull
                    unique: true
                    uniqueConstraintName: uq_loan_repayment_void_loan_repayment_id

              - column:
                  name: void_date
                  type: date
                  constraints:
                    nullable: false
                    notNullConstraintName: loan_repayment_void_void_date_notnull

              - column:
                  name: reason
                  type: text

              - column:
                  name: created_by_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: loan_repayment_void_created_by_id_notnull

              - column:
                  name: created_on
                  type: timestamptz
                  defaultValueDate: ${now}
      rollback:
        - dropTable:
            tableName: loan_repayment_void
