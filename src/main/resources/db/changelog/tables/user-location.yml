databaseChangeLog:
  - changeSet:
      id: '1'
      author: ezra
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: user_location
      changes:
        - createTable:
            tableName: user_location
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: ${uuid_function}
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: user_location_user_id_notnull

              - column:
                  name: location_id
                  type: uuid
                  constraints:
                    nullable: false
                    notNullConstraintName: user_location_location_id_notnull

              - column:
                  name: start_on
                  type: timestamptz
                  defaultValueDate: ${now}

              - column:
                  name: end_on
                  type: timestamptz
