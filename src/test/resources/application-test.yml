spring:
  config:
    import: optional:file:docker/test.properties

  main:
    allow-bean-definition-overriding: true
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - com.okta.spring.boot.oauth.OktaOAuth2AutoConfig
      - com.okta.spring.boot.sdk.config.OktaClientPropertiesConfiguration

  datasource:
    location:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST}:${TEST_DB_PORT}/${TEST_DB_NAME}
      username: ${TEST_DB_USERNAME}
      password: ${TEST_DB_PASSWORD}
      changelog: db/changelog/locations/db-changelog-master.yml
      
    platform:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST}:${TEST_DB_PORT}/${TEST_DB_NAME}?currentSchema=platform
      username: ${TEST_DB_USERNAME}
      password: ${TEST_DB_PASSWORD}
      
    organization:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST}:${TEST_DB_PORT}/${TEST_DB_NAME}
      username: ${TEST_DB_USERNAME}
      password: ${TEST_DB_PASSWORD}
      changelog: db/changelog/organizations/db-changelog-master.yml

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS}
    listener:
      auto-startup: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true

okta:
  oauth2:
    issuer: ${TEST_OKTA_ISSUER}
    client-id: ${TEST_OKTA_CLIENT_ID}
    client-secret: ${TEST_OKTA_CLIENT_SECRET}
    discovery:
      enabled: false
  client:
    org-url: ${TEST_OKTA_ORG_URL}
    token: ${TEST_OKTA_TOKEN}

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  liquibase:
    platform-enabled: true
    organization-enabled: true
    location-enabled: false
