spring:
  main:
    allow-bean-definition-overriding: true
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - com.okta.spring.boot.oauth.OktaOAuth2AutoConfig
      - com.okta.spring.boot.sdk.config.OktaClientPropertiesConfiguration

  datasource:
    location:
      jdbc-url: jdbc:postgresql://localhost:5434/rtss_test
      username: rtss_user
      password: rtss_password
      
    platform:
      jdbc-url: jdbc:postgresql://localhost:5434/rtss_test
      username: rtss_user
      password: rtss_password
      
    organization:
      jdbc-url: jdbc:postgresql://localhost:5434/rtss_test
      username: rtss_user
      password: rtss_password

  kafka:
    bootstrap-servers: localhost:9094

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true

okta:
  oauth2:
    issuer: http://localhost:8080
    client-id: test-client-id
    client-secret: test-client-secret
    discovery:
      enabled: false
  client:
    org-url: http://localhost:8080
    token: test-token

logging:
  level:
    org.hibernate.SQL: DEBUG
