spring:
  config:
    import: optional:file:docker/test.properties

  main:
    allow-bean-definition-overriding: true
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - com.okta.spring.boot.oauth.OktaOAuth2AutoConfig
      - com.okta.spring.boot.sdk.config.OktaClientPropertiesConfiguration

  datasource:
    location:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5435}/${TEST_DB_NAME:rtss_e2e_test}
      username: ${TEST_DB_USERNAME:rtss_test_user}
      password: ${TEST_DB_PASSWORD:rtss_test_password}
      
    platform:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5435}/${TEST_DB_NAME:rtss_e2e_test}?currentSchema=platform
      username: ${TEST_DB_USERNAME:rtss_test_user}
      password: ${TEST_DB_PASSWORD:rtss_test_password}
      
    organization:
      jdbc-url: jdbc:postgresql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:5435}/${TEST_DB_NAME:rtss_e2e_test}
      username: ${TEST_DB_USERNAME:rtss_test_user}
      password: ${TEST_DB_PASSWORD:rtss_test_password}

  kafka:
    bootstrap-servers: ${TEST_KAFKA_BOOTSTRAP_SERVERS:localhost:9095}
    listener:
      auto-startup: false

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true

okta:
  oauth2:
    issuer: http://localhost:8080
    client-id: test-client-id
    client-secret: test-client-secret
    discovery:
      enabled: false
  client:
    org-url: http://localhost:8080
    token: test-token

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  liquibase:
    platform-enabled: true
    organization-enabled: true
    location-enabled: false
